   {t:"Lui parler de l'équipe, de ses perspectives, lui promettre une formation",fn:()=>{if(chance((C.morale??70)/100)){mor(2,"fidélité de "+a.name);return `${a.name} reste : « Ici, on se serre les coudes. » Le bon moral de l'équipe a fait la différence.`}C.team.splice(C.team.indexOf(a),1);mor(-4,"départ de "+a.name);return `${a.name} part chez le concurrent : le moral de l'équipe n'était pas assez bon pour le retenir.`}},

  else if((C.samk||0)<=0){C.team=C.team.filter(a=>!a.sam);C.samGone=true;S.teamMsg.push("😔 <b>Sam a démissionné</b> par SMS cet après-midi : « Ce métier n'est pas pour moi. » Un jeune à qui personne n'a vraiment tendu la main.");mor(-5,"départ de Sam")}}

const RANKS=[[0,"Agent de sécurité"],[300,"Chef d'équipe"],[800,"Chef de sécurité"],[1600,"Responsable sûreté"],[3000,"Directeur de la sûreté"]];
const PERKS=["","Expérience du terrain : interventions un peu plus souvent réussies","Négociateur : budgets des gérants +10 %","Vigilance : incidents repérés plus vite partout","Leader : le moral de l'équipe ne descend jamais sous 40"];
function xpGet(){try{return +(localStorage.getItem("secu_nuit_xp")||0)}catch(e){return 0}}
function xpSet(v){try{localStorage.setItem("secu_nuit_xp",String(v))}catch(e){}}
function rankIdx(xp){let r=0;RANKS.forEach((k,i)=>{if(xp>=k[0])r=i});return r}
function perk(n){return rankIdx(xpGet())>=n}
function rankHtml(){const xp=xpGet(),r=rankIdx(xp),nx=RANKS[r+1];const pc=nx?Math.round((xp-RANKS[r][0])/(nx[0]-RANKS[r][0])*100):100;
 return `<div class="card" style="border-color:#ffc04d"><div style="display:flex;justify-content:space-between;align-items:center"><b style="color:#ffc04d">🎖️ ${RANKS[r][1]}</b><span class="small">${xp} XP</span></div><div class="bar"><i style="width:${pc}%;background:linear-gradient(90deg,#ffc04d,#ff3d9a)"></i></div><div class="small" style="margin-top:4px">${nx?`Prochain grade : ${nx[1]} (${nx[0]} XP)`:"Grade maximal atteint"}</div>${PERKS.slice(1,r+1).map(p=>`<div class="small" style="color:#9fe0b4">✔ ${p}</div>`).join("")}</div>`}
function trophiesHtml(){const T=trGet();const n=TROPH.filter(t=>T[t.id]).length;
 return `<details class="cons" style="border-color:var(--neon)"><summary style="color:var(--neon)">🏆 Trophées (${n}/${TROPH.length})</summary>${TROPH.map(t=>`<div style="margin:6px 0;${T[t.id]?"":"opacity:.4"}">${T[t.id]?t.i:"🔒"} <b>${t.n}</b> <span class="small">— ${t.d}</span></div>`).join("")}</details>`}

function makeHeadline(){

 const H=[[/RIXE|rixe/,"Nuit de violence "+au+" : une rixe générale fait plusieurs blessés","Le préfet pourrait ordonner une fermeture administrative."],
  [/couteau|Couteau|arme/,"Un client blessé au couteau "+au,"La question des contrôles à l'entrée est posée."],
  [/testing|discrimination/,"Discrimination à l'entrée : "+N0+" : une association porte plainte","Les images du refus circulent sur les réseaux."],

  [/Jauge|bondée/,N0+" : bondé au-delà de sa capacité","Un client : « On ne pouvait plus bouger. »"],
  [/mineur|Mineur/,"Des mineurs servis en alcool "+au+" ?","Les parents d'une adolescente s'indignent."],
  [/feu|Feu|Explosion|incendie/,"Début d'incendie "+au+", évacuation","Les pompiers sont intervenus dans la nuit."]];
 for(const[re,t,sub]of H){if(re.test(F)||(re.source.includes("rixe")&&failed.includes("rixe")))return{t,sub,bad:true}}

function lbl(t){const P=t.split(/ : |, | ; | — /);let x=P[0];if(x.length<16&&P[1])x+=", "+P[1];x=x.replace(/\s*\(.*?\)\s*/g," ").trim();if(x.length>70)x=x.slice(0,68).replace(/\s\S*$/,"")+"…";return x.charAt(0).toUpperCase()+x.slice(1)}
function fault(txt,law){S.faults.push({txt,law})}
function good(txt){S.goods.push(txt)}
function agentStars(n){return"★".repeat(n)+"☆".repeat(5-n)}

}

function genClient(i,opt={}){
 const m=S.N.mod;
 const sex=opt.sex||(chance(.55)?"H":"F");
 let first=pick(sex==="H"?PREN_H:PREN_F),last=pick(NOMS);
 const minor=opt.minor??chance(.08*m.minor);
 const age=minor?RI(16,17):(chance(.35)?RI(18,21):RI(22,48));
 const r=Math.random();
 const c={id:i,sex,first,last,age,minor,size:Math.max(1,Math.round((opt.size??(chance(.35)?1:RI(2,4)))*(opt.size?1:VEN().sizeMul))),
  ivresse:opt.iv??(r<.58-m.iv?0:r<.86-m.iv/2?1:2),
  tenue:chance(.12)?"surv":pick(["soignee","jean","robe","chemise","basket"]),
  attitude:(()=>{const q=Math.random()-m.agr;return q<.58?"calme":q<.78?"impatient":q<.91?"arrogant":"menacant"})(),
  weapon:opt.weapon??(sex==="H"&&chance(.07*m.weapon)),drug:chance(.09*(VEN().drugMul||1)),testing:!!opt.testing,
  black:false,idChecked:false,palp:null,palpRefused:false,found:null,col:pick(COLORS),extraCues:[],protect:null};
 if(c.sex==="F"&&c.tenue==="chemise")c.tenue="robe";
 const y=GAME_DATE.getFullYear()-age-(chance(.5)?1:0);
 let dob=new Date(y,RI(0,11),RI(1,28));
 c.idType=pick(["Carte nationale d'identité","Permis de conduire","Passeport"]);
 c.idPhoto=true;c.hasId=true;
 if(minor){const q=Math.random();
  if(q<.45){c.idPhoto=false;dob=new Date(GAME_DATE.getFullYear()-RI(20,24),RI(0,11),RI(1,28));c.idName=pick(sex==="H"?PREN_H:PREN_F)+" "+last}
  else if(q<.75){c.hasId=false;if(C.night===1)c.studentCard=true}
 } else if(chance(.04)){c.hasId=false}
 c.dob=dob;c.idAge=Math.floor((GAME_DATE-dob)/(365.25*864e5));
 if(c.testing){Object.assign(c,{ivresse:0,attitude:"calme",weapon:false,drug:false,minor:false,hasId:true,idPhoto:true,size:RI(2,3),protect:"testing"});c.tenue=pick(["soignee","chemise","jean"]);c.idName=null}
 if(c.weapon)c.ivresse=Math.max(c.ivresse,1);
 calcRisk(c);

function ask(k){
 closeModal();const c=S.queue[S.qi];c.asked=c.asked||[];S.min+=.5;
 const q=QUEST.find(x=>x[0]===k)[1];let a;
 const borrowed=c.minor&&c.idName&&!c.idPhoto;const d=c.dob;const ds=`${d.getDate()} ${["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"][d.getMonth()]} ${d.getFullYear()}`;
 const slur=c.ivresse===2;
 if(k==="dob"){a=slur?`« Le… euh… ${ds}… je crois ? » (il cherche longtemps)`:borrowed?(chance(.6)?`« Euh… le ${d.getDate()+1>28?3:d.getDate()+1}… non, le… attends » (il hésite et regarde sa pièce)`:`« Le ${ds}. » (récité un peu trop vite)`):c.minor&&!c.hasId?`« ${GAME_DATE.getFullYear()-19}… euh, oui, j'ai 19 ans. » (il compte sur ses doigts)`:c.black&&c.aliasName?`« Pourquoi tu me demandes ça ? » (il esquive)`:`« Le ${ds}. » `}
 if(k==="signe"){const z=zodiac(d);a=borrowed?(chance(.7)?`« ${pick(["Lion","Bélier","Scorpion","Taureau","Poissons"].filter(x=>x!==z))}. » `:`« … ${z}, je crois ? »`):c.minor&&!c.hasId?"« Euh… j'en sais rien, je crois pas à ces trucs. »":`« ${z} ! » `}
 if(k==="verres")a=c.ivresse===0?pick(["« Rien encore, on arrive. »","« Un verre à l'apéro, c'est tout. »"]):c.ivresse===1?"« Deux ou trois bières, tranquille. »":"« Juste… une bière, je te jure… » (il se rattrape à son ami)";
 if(k==="dou")a=c.attitude==="menacant"?"« Ça te regarde ? »":c.drug?"« D'une soirée chez un pote… » (il se gratte le nez, renifle)":c.minor?pick(["« De chez une copine, on s'est préparées ensemble. »","« Du lycée… euh, de la fac ! »"]):pick(["« Du restaurant d'à côté. »","« On sort d'un anniversaire. »","« Du bar en face. »"]);
 if(k==="adresse")a=borrowed?(chance(.6)?"« Euh… dans le centre… le code postal… » (il cherche)":"« Dans le centre. » (vague)"):c.etr?"« We are tourists, hotel near the station. »":"« À "+pick(["deux rues d'ici","Saint-Pierre","la sortie de la ville","côté gare"])+". » ";
 if(k==="deja")a=c.black?(c.aliasName?"« Jamais venu, c'est la première fois ! » ":"« Oui, plein de fois, je suis un habitué. »"):pick(["« Une fois, l'été dernier. »","« Non, première fois. »","« Oui, de temps en temps. »"]);
 if(c.deaf)a="(Il te fait signe qu'il n'entend pas et te tend son téléphone pour écrire la question.) Réponse écrite : "+a.replace(/ \(.*\)$/,"");
 if(c.protect==="origine"&&k!=="verres")a="« Sorry… je comprends pas bien… we are from "+pick(["London","Madrid","Roma","Bruxelles"])+". » (touriste, réponse en anglais)";
 c.asked.push([q,a]);render();
}

function refuse(k){
 try{sfxNo()}catch(e){}
 closeModal();
 const c=S.queue[S.qi];S.refusedN++;
 const full=S.inside+c.size>S.cap;
 const valid={ivresse:c.ivresse===2,mineur:c.minor||!c.hasId||(c.idChecked&&!c.idPhoto&&!c.black&&!c.protect)||(c.twin&&c.size>1),tenue:c.tenue==="surv"&&!!VEN().dress,cap:full,
  comport:c.attitude==="menacant"||c.attitude==="arrogant",palp:c.palpRefused,objet:!!c.found,liste:c.black,animal:!!c.pet,garcons:false,profil:false,sans:false}[k];
 const lbl=REFUS.find(r=>r[0]===k)[1];
 let res=[];
 if(c.black&&!valid&&k!=="liste"){/* refuser un exclu pour un mauvais motif reste un refus fondé sur la liste */}
 if(valid||(c.black&&!["profil","sans","animal","garcons"].includes(k))){
  S.secu+=c.risk>2?4:1;S.rep+=1;
  const why={ivresse:"Ivresse manifeste : refus fondé.",mineur:c.minor?`Bien vu : ${c.first} avait <b>${c.age} ans</b>.`:"Pas de pièce valable : consigne respectée.",tenue:"Dress code appliqué à tous : refus légitime.",cap:"Jauge atteinte : la sécurité d'abord.",comport:"Comportement menaçant ou agressif : refus justifié.",palp:"Refus de palpation : l'entrée peut légalement être refusée.",objet:"Objet dangereux / stupéfiants : refus évident.",liste:"Personne exclue : consigne respectée.",animal:"Un chien de compagnie peut être refusé (règlement de l'établissement). Ce n'est pas le cas d'un chien guide ou d'assistance."}[k]||"Refus fondé.";
  res.push(["",why]);
  if(c.black)res.push(["",`C'était bien <b>${esc(c.blRef.name)}</b> (liste noire)${c.aliasName?" qui donnait un faux nom":""}.`]);if(c.black&&c.aliasName)S.lynx=true;
  if(c.weapon&&!c.found)res.push(["","(Il cachait un <b>couteau</b> : bonne pioche.)"]);
  if(c.found==="jouet"&&k==="objet")res.push(["n","Un peu sévère : proposer de déposer l'accessoire au vestiaire suffisait."]);
  if(c.vip&&k==="ivresse"){C.sat-=4;res.push(["n","Le gérant râle (« c'est mes VIP ! »), mais tu as eu raison : on ne fait pas entrer quelqu'un de manifestement ivre."]);good("VIP manifestement ivre refusé malgré la pression du gérant.")}
  else good(`Refus fondé : ${c.first} ${c.last} (${lbl}).`);
 } else if(k==="garcons"&&c.sex==="H"){
  S.rep-=12;S.discri=true;fault(`Refus d'un groupe d'hommes « parce que trop de garçons » (${c.first} ${c.last}).`,"Discrimination fondée sur le sexe (art. 225-1 et 225-2 Code pénal), jusqu'à 5 ans et 75 000 €. Une consigne illégale du gérant ne couvre pas l'agent qui l'applique.");
  res.push(["b","Refuser à cause du sexe est une <b>discrimination</b>, même sur consigne du gérant."]);
 } else if(PROT[c.protect]){
  const P=PROT[c.protect];S.rep-=18;S.discri=true;fault(`Refus de ${c.first} ${c.last} — motif invoqué : « ${lbl} ».`,P.law);
  res.push(["b",`C'est une <b>discrimination ${P.lbl}</b>. Le groupe filme et publie la vidéo.`]);
 } else if(c.protect==="testing"||k==="profil"||k==="sans"){
  S.discri=true;if(c.protect==="testing"){S.rep-=20;fault(`Testing : refus de ${c.first} ${c.last} (« ${lbl} »).`,"Discrimination dans l'accès à un lieu ouvert au public (art. 225-1 et 225-2 Code pénal) : jusqu'à 5 ans de prison et 75 000 € d'amende. Un faux motif n'y change rien.");res.push(["b","C'était un <b>testing</b> d'une association antiraciste ! Un groupe au profil identique est entré juste avant. Constat et plainte pour discrimination."])}
  else{S.rep-=6;fault(`Refus sans motif objectif (${c.first} ${c.last}).`,"Un refus qui ne repose pas sur un critère objectif peut constituer une discrimination (art. 225-1 Code pénal).");res.push(["b","Aucun motif objectif : le client filme et menace de porter plainte pour discrimination."])}
 } else {
  const detail={ivresse:c.ivresse===1?"Il/elle avait bu mais n'était pas manifestement ivre : refus discutable.":"Il/elle était sobre.",mineur:`Il/elle avait bien ${c.age} ans, pièce en règle.`,tenue:VEN().dress?"La tenue respectait le dress code.":"Il n'y a pas de dress code ici !",cap:`Il restait de la place (${S.inside}/${S.cap}).`,comport:"Il/elle n'était pas agressif(ve).",palp:c.palp?"Il/elle avait accepté la palpation.":"Tu n'as même pas proposé de palpation.",objet:"Rien n'a été trouvé.",liste:"Ce n'est pas une personne de la liste noire (vérifie le signalement).",animal:"Il n'y avait pas d'animal.",garcons:"Ce n'était pas un groupe de garçons."}[k];
  S.rep-=(k==="ivresse"&&c.ivresse===1)?1:4;res.push(["n",detail+" Motif inexact : risque de contestation, et clients perdus."]);
 }
 if(c.mystere){C.sat=clamp(C.sat-8,0,100);res.push(["b","🕵️ C'était le <b>client mystère</b> du gérant, venu tester l'accueil : refus injustifié noté dans son rapport."])}
 if(c.hab==="nadia"){S.rep-=4;res.push(["b","Nadia, l'habituée, repart blessée par ce refus sans raison."])}
 if(c.hab==="lucas"&&C.night%5===4&&k==="mineur"){res.push(["n","Il avait 18 ans <b>aujourd'hui</b> : regarde bien le jour et le mois de naissance !"])}
 if(c.hab==="kevin"&&C.night%5===2&&k==="ivresse"){res.push(["","Kévin râle mais rentre chez lui. Il reviendra s'excuser…"])}
 if(c.attitude==="menacant"&&chance(.45)){schedEv("revanche");res.push(["n","Il part en lançant : « Je vais revenir, tu vas voir… »"])}
 if(c.ivresse===2&&chance(.35)){S.extraInc=(S.extraInc||[]).concat(["issue"]);res.push(["n","Il fait le tour du bâtiment en marmonnant… direction l'issue de secours ?"])}
 if(c.black&&chance(.4)){S.extraInc=(S.extraInc||[]).concat(["exterieur"])}
 S.secu=clamp(S.secu,0,100);S.rep=clamp(S.rep,0,100);
 nextClient({title:badClass(res)?"Refus problématique":"Entrée refusée",html:res.map(r=>`<div class="result ${r[0]}">${r[1]}</div>`).join("")});
}

 motif:{t:"« Donnez-moi votre nom ! »",d:"Un client refusé plus tôt revient : il exige le motif exact du refus, le nom de l'agent et menace de « porter plainte pour discrimination ».",
  o:[{t:"Rester poli, redonner calmement le motif objectif du refus, et lui indiquer qu'il peut contacter la direction ou porter plainte s'il le souhaite",r:5,g:"Un refus fondé sur un motif objectif se justifie sans crainte. Transparence et calme."},
   {t:"Lui répondre que tu n'as pas à te justifier et lui fermer la porte au nez",r:-6,txt:"Il filme la scène et poste la vidéo : « refus sans explication »."},
   {t:"Lui inventer un motif sur le moment",r:-8,f:"Motif inventé après coup.",law:"Changer de motif est la meilleure preuve d'une discrimination en cas de plainte (art. 225-1 Code pénal)."}]},
 femme_fuit:{t:"Une femme demande de l'aide",d:"Une jeune femme arrive en courant à la porte, en larmes : un homme la suit depuis la gare et la menace. Il est à 20 mètres.",
  o:[{t:"La faire entrer à l'abri derrière la porte, appeler le 17, noter le signalement de l'homme sans aller au contact dans la rue",s:8,r:6,g:"Mise à l'abri, alerte, signalement : exactement ce qu'il fallait."},
   {t:"Lui dire de faire la file comme tout le monde",s:-10,r:-8,f:"Personne en danger laissée dans la rue.",law:"Non-assistance à personne en danger (art. 223-6 Code pénal)."},
   {t:"Courir après l'homme pour lui « régler son compte »",s:-6,f:"Agent parti en chasse sur la voie publique.",law:"Hors de l'établissement, l'agent n'a aucune mission de police. Et la porte reste sans surveillance."}]},
 accident:{t:"Accident devant l'entrée",d:"Un scooter percute un piéton juste devant la file. Le piéton est au sol et ne bouge pas, le conducteur titube.",
  o:[{t:"Protéger la zone (baliser, faire reculer la foule), appeler le 18 ou le 15, ne pas bouger la victime, lui parler et surveiller sa respiration",s:9,r:5,g:"Protéger, alerter, secourir : la base du secourisme."},
   {t:"Relever le piéton et l'asseoir sur le trottoir",s:-8,f:"Victime d'un choc déplacée.",law:"Après un accident de la route, on ne bouge pas la victime (risque de lésion de la colonne)."},
   {t:"Continuer à faire entrer les clients, les secours vont venir",s:-10,r:-6,f:"Aucun secours porté à un blessé devant ta porte.",law:"Non-assistance à personne en danger (art. 223-6 Code pénal)."}]},
 dealers:{t:"Deal devant l'entrée",d:"Deux types proposent de la drogue aux clients qui font la file : « T'as besoin de quelque chose pour ce soir ? »",
  o:[{t:"Leur demander de s'éloigner de la file, prévenir le 17, noter leur signalement et ne pas faire entrer leurs clients",s:6,r:3,g:"Signalement et vigilance : le trafic devant la porte finit toujours à l'intérieur."},
   {t:"Les laisser, c'est sur la voie publique",s:-6,f:"Trafic toléré devant l'établissement.",law:"Un trafic aux abords peut entraîner une fermeture administrative (art. L3332-15 CSP)."},
   {t:"Les attraper et leur vider les poches",s:-6,r:-4,f:"Fouille et saisie sur la voie publique par des agents privés.",law:"Pas de fouille, pas de saisie : c'est le travail de la police."}]},
 bouteille_perso:{t:"Clients avec leur bouteille",d:"Un groupe arrive avec une bouteille de vodka entamée cachée dans un sac : « On la finit dedans, discret. »",
  o:[{t:"Refuser l'entrée avec la bouteille : la jeter ou la laisser dehors, puis contrôle normal",s:3,r:2,g:"Pas d'alcool extérieur : règle de l'établissement et contrôle de l'alcoolisation."},
   {t:"Les laisser entrer avec, pas de souci",s:-4,r:-2,txt:"Ils finissent ivres morts, et le gérant voit la bouteille vide sur une table.",sat:-3}]},
 journaliste:{t:"Un journaliste filme",d:"Une équipe de télé locale fait un reportage sur « la nuit en ville ». Le journaliste veut filmer la file et te poser des questions.",
  o:[{t:"Renvoyer vers le gérant pour l'autorisation, demander de ne pas filmer les clients sans leur accord",r:5,g:"Droit à l'image des clients et communication réservée au gérant : réponse pro."},
   {t:"Raconter en direct les bagarres de la semaine dernière",r:-10,sat:-6,f:"Informations internes données à la presse sans autorisation.",law:"Obligation de discrétion professionnelle des agents de sécurité (code de déontologie des activités privées de sécurité)."},
   {t:"Arracher la caméra",r:-12,s:-4,f:"Violences sur un journaliste.",law:"On ne touche ni aux personnes ni à leur matériel : l'espace public peut être filmé."}]},
 supporters:{t:"Les supporters arrivent",d:"Après le match, une vingtaine de supporters de l'équipe qui a perdu arrivent en chantant, certains très éméchés.",
  o:[{t:"Les faire attendre groupés, contrôler individuellement, refuser les plus ivres et les agressifs, laisser entrer les autres par petits groupes",s:6,r:4,g:"Contrôle au cas par cas : aucun groupe n'est refusé « en bloc », mais aucun ivre n'entre."},
   {t:"Refuser tout le groupe d'office",r:-4,txt:"Ils restent devant à chanter et à bloquer la file pendant une heure."},
   {t:"Les faire tous entrer d'un coup",s:-10,f:"Groupe ivre admis sans contrôle.",law:"Interdit de faire entrer et de servir des personnes manifestement ivres (Code de la santé publique)."}]},
 lacrymoperso:{t:"La bombe dans le sac",d:"À la fouille visuelle, une cliente montre une petite bombe lacrymogène : « C'est pour me défendre en rentrant seule la nuit. »",note:"de nombreuses femmes disent avoir peur en rentrant seules la nuit. Les bombes lacrymogènes sont des armes (catégorie D) : leur port sans motif légitime est interdit.",
  o:[{t:"Lui expliquer calmement qu'elle ne peut pas entrer avec, proposer de la laisser au vestiaire jusqu'à la sortie, et lui indiquer qu'on peut l'aider à rentrer en sécurité (taxi)",s:4,r:5,g:"Règle respectée, avec compréhension : elle entre rassurée."},
   {t:"La laisser entrer avec",s:-6,f:"Arme de catégorie D admise dans la salle.",law:"Une bombe lacrymogène vidée en salle provoque une panique (déjà vu) : aucune arme dans l'établissement."},
   {t:"La confisquer et la jeter",r:-5,txt:"Elle repart furieuse : on ne détruit pas le bien d'un client."}]},
 identitenum:{t:"La carte d'identité sur téléphone",d:"Un client présente sa carte d'identité dans l'application officielle France Identité, sur son téléphone, au lieu de la carte physique.",note:"l'application France Identité permet de présenter un justificatif d'identité numérique. Une simple photo de carte, elle, ne prouve rien.",
  o:[{t:"Vérifier dans l'application (pas une capture d'écran), comparer la photo et la date de naissance, puis accepter si tout correspond",r:4,g:"Vérification sérieuse d'un justificatif numérique officiel : contrôle valable."},
   {t:"Refuser : seule la carte physique compte",r:-3,txt:"Le client montre le justificatif officiel à un autre agent, qui l'accepte. Incohérence dans l'équipe."},
   {t:"Accepter aussi une simple photo de carte envoyée par un ami",s:-6,f:"Photo de pièce d'identité acceptée.",law:"Une photo ne prouve ni l'identité ni l'âge : c'est la porte ouverte aux mineurs."}]},
 motaide:{t:"Un mot glissé discrètement",d:"En te tendant sa pièce, une jeune femme glisse un papier plié : « Aidez-moi. » L'homme qui l'accompagne tient son passeport et répond à sa place.",note:"les associations de lutte contre la traite des êtres humains forment les professionnels de la nuit à repérer ces signaux : une personne qui ne parle pas pour elle, sans ses papiers, sous contrôle.",
  o:[{t:"Rester naturel, séparer discrètement la jeune femme sous un prétexte (contrôle, vestiaire), la mettre à l'abri et appeler le 17",s:10,r:6,g:"Tu as peut-être sauvé quelqu'un : discrétion, mise à l'abri, alerte."},
   {t:"Lire le mot à voix haute et demander à l'homme de s'expliquer",s:-12,f:"Victime exposée devant celui qui la contrôle.",law:"Il ne faut jamais mettre la victime en danger : on agit discrètement et on alerte la police."},
   {t:"Les faire entrer, ce n'est pas tes affaires",s:-14,f:"Appel à l'aide ignoré.",law:"Non-assistance à personne en danger (art. 223-6 Code pénal)."}]},
 voisinferme:{t:"Le club voisin est fermé",d:"La préfecture vient de fermer le club d'à côté pour un mois après des bagarres. Ses clients arrivent en masse chez vous, certains déjà énervés.",note:"les fermetures administratives de discothèques sont régulières en France après des violences ou des trafics, souvent pour plusieurs semaines.",
  o:[{t:"Garder la même rigueur : jauge, contrôle individuel, refus des plus agités. Prévenir l'équipe de salle",s:7,r:3,g:"La rigueur évite de récupérer les problèmes du voisin… et sa fermeture."},
   {t:"Ouvrir grand, c'est une aubaine",s:-10,f:"Contrôles relâchés face à un afflux de clients à risque.",law:"Un établissement qui laisse entrer n'importe qui s'expose lui aussi à une fermeture administrative (art. L3332-15 CSP)."}]},
 bebe:{t:"La poussette",d:"Une jeune mère arrive avec un bébé en poussette, furieuse : « Mon mari est là-dedans, il devait garder le petit ! Je veux entrer le chercher ! »",
  o:[{t:"Ne pas faire entrer le bébé, prendre le nom du mari, envoyer un agent le chercher et le faire sortir",r:5,g:"Un bébé n'a rien à faire dans le bruit et l'alcool : on règle la situation à l'entrée."},
   {t:"La laisser entrer avec la poussette",s:-6,r:-3,f:"Nourrisson admis dans une discothèque.",law:"Bruit, fumée, alcool, foule : danger pour un nourrisson et pour la sécurité de l'évacuation."}]},
 foyer:{t:"La sortie du foyer",d:"Un éducateur arrive avec cinq adultes en situation de handicap mental, d'un foyer voisin. Ils sont ravis de venir danser.",
  o:[{t:"Les accueillir normalement, contrôle habituel, éventuellement leur indiquer un coin plus calme",r:6,g:"Accueil comme tout le monde : refuser serait une discrimination liée au handicap."},
   {t:"Refuser : « ça risque de mettre mal à l'aise les autres clients »",r:-18,f:"Refus d'un groupe en raison du handicap.",law:"Discrimination liée au handicap (art. 225-1 et 225-2 Code pénal)."}]},
 montre:{t:"Une montre « pas chère »",d:"Un client dans la file te propose discrètement une montre de luxe à 100 € : « Elle est neuve, je te fais un prix. »",
  o:[{t:"Refuser, noter sa description et le signaler à la police (la montre est probablement volée)",s:3,r:3,g:"Acheter un objet volé, c'est du recel. Bon réflexe de signaler."},
   {t:"L'acheter, c'est une affaire",r:-8,f:"Achat d'un objet probablement volé.",law:"Recel (art. 321-1 Code pénal) : jusqu'à 5 ans d'emprisonnement."}]},
 touriste:{t:"Le touriste perdu",d:"Un touriste japonais, un peu perdu, te montre l'adresse de son hôtel sur son téléphone. Il ne parle ni français ni anglais.",
  o:[{t:"Lui montrer le chemin sur une carte, lui appeler un taxi si c'est loin, avec le sourire",r:4,g:"L'accueil, c'est aussi ça : l'image de l'établissement et de la ville."},
   {t:"Lui faire signe de partir, tu as du travail",r:-2,txt:"Il erre dans le quartier pendant une heure."}]},
 ordonnance:{t:"L'ex de Nadia est là",d:"L'ex-compagnon de Nadia arrive, très tendu : « Je sais qu'elle est là, je veux la voir. » Nadia t'a dit qu'une ordonnance de protection lui interdit de l'approcher.",
  o:[{t:"Refuser l'entrée calmement, le garder à distance, prévenir l'équipe de salle pour protéger Nadia, appeler le 17 : il viole peut-être une ordonnance",s:9,r:6,g:"Ne pas respecter une ordonnance de protection est un délit : la police intervient vite. Nadia est en sécurité."},
   {t:"Le laisser entrer, l'ordonnance c'est leur affaire",s:-14,r:-8,f:"Auteur présumé de violences conjugales admis malgré une ordonnance de protection.",law:"Violation d'une ordonnance de protection : délit (art. 227-4-2 Code pénal). La victime était en danger."},
   {t:"Lui dire qu'elle est au bar, pour éviter un scandale à la porte",s:-16,r:-10,f:"Information donnée à l'auteur sur la présence de la victime.",law:"La victime a fait confiance à l'équipe : on ne révèle jamais où elle se trouve."}]},
 mission:{t:"Policiers en mission",d:"Deux personnes en civil te montrent discrètement leur carte de police : « On est en mission, on doit entrer sans se faire remarquer. »",
  o:[{t:"Vérifier rapidement la carte, les laisser entrer discrètement, prévenir le gérant sans alerter la salle",s:4,r:3,g:"En mission, les policiers peuvent entrer dans un lieu ouvert au public. Discrétion et coopération."},
   {t:"Leur faire payer l'entrée et les faire passer par la palpation",r:-4,txt:"Tu as failli faire échouer leur surveillance devant tout le monde.",sat:-2},
   {t:"Annoncer au micro que la police est là",s:-10,r:-6,f:"Opération de police compromise.",law:"Révéler une opération de police en cours peut constituer une entrave à la justice."}]},
 mariage:{t:"Le mariage arrive",d:"Une noce de 30 personnes arrive après le repas, en costumes et robes de soirée. Certains sont très ivres, d'autres sobres, dont les mariés.",
  o:[{t:"Contrôler chaque invité individuellement : faire entrer les sobres et les mariés, refuser poliment les quelques invités trop ivres",s:6,r:5,g:"Contrôle au cas par cas, même dans un groupe festif : la noce continue sans les plus alcoolisés."},
   {t:"Tout le monde entre, c'est un mariage !",s:-8,f:"Invités manifestement ivres admis en groupe.",law:"Interdit de servir une personne manifestement ivre (Code de la santé publique)."},
   {t:"Refuser toute la noce, trop de monde ivre",r:-6,txt:"La mariée pleure devant la porte, les sobres partent furieux.",sat:-3}]},
 beaufrere:{t:"« Je suis le beau-frère du patron »",d:"Un homme passe devant toute la file : « Je suis le beau-frère du patron, appelle-le si tu veux. » Il sent fort l'alcool.",
  o:[{t:"L'inviter à patienter, appeler le gérant pour vérifier, et le contrôler comme tout le monde (dont son état d'ivresse)",r:3,g:"Vérifier et contrôler : la parenté ne dispense pas du contrôle d'ivresse."},
   {t:"Le faire entrer tout de suite",s:-4,r:-2,txt:"Le gérant n'a pas de beau-frère. Il finit ivre mort au bar."}]},
 rampe:{t:"L'accès en fauteuil",d:"Une cliente en fauteuil roulant arrive : l'entrée a trois marches. « Il y a un accès ? »",
  o:[{t:"Installer la rampe amovible prévue, l'aider si elle le souhaite, puis contrôle normal",r:6,g:"Accessibilité des ERP : on met en place l'accès prévu, avec respect."},
   {t:"S'excuser : « Ce n'est pas accessible, désolé »",r:-12,f:"Accès refusé à une personne en fauteuil.",law:"Les ERP doivent être accessibles aux personnes handicapées (loi du 11 février 2005) ; refuser l'accès peut constituer une discrimination."}]},
 arriveivre:{t:"Il arrive au volant",d:"Une voiture se gare en travers devant l'entrée. Le conducteur sort en titubant, les yeux rouges, et veut entrer.",
  o:[{t:"Refuser l'entrée (ivresse manifeste), lui proposer d'appeler un taxi, et prévenir le 17 s'il reprend le volant",s:7,r:3,g:"Refus fondé et prévention : il ne reprendra pas la route ivre sans que la police soit prévenue."},
   {t:"Le faire entrer, il ne conduit plus pour l'instant",s:-6,f:"Personne manifestement ivre admise.",law:"Interdit de servir une personne manifestement ivre (Code de la santé publique), et il repartira en voiture."}]},
 mineursdehors:{t:"Des ados boivent devant l'entrée",d:"Une bande d'adolescents de 15 ans boit de la vodka sur le trottoir, juste à côté de la file. L'une d'elles a l'air très mal.",
  o:[{t:"S'assurer que la jeune fille va bien (15 si besoin), leur demander de s'éloigner et prévenir le 17 pour des mineurs alcoolisés",s:6,r:4,g:"Des mineurs en danger devant ta porte : on vérifie, on alerte."},
   {t:"Ce n'est pas devant chez nous, on ignore",s:-6,r:-4,txt:"La jeune fille fait un coma éthylique sur le trottoir 20 minutes plus tard."}]},
 voisin:{t:"Le voisin en pyjama",d:"Un voisin furieux, en pyjama, arrive à la porte : la musique l'empêche de dormir et il menace d'appeler la mairie.",
  o:[{t:"L'écouter, s'excuser, faire baisser les basses par le DJ et fermer les fenêtres, lui laisser le numéro du gérant",r:5,g:"Les bonnes relations avec le voisinage évitent les fermetures administratives pour bruit."},
   {t:"Lui dire d'acheter des bouchons d'oreilles",r:-6,sat:-4,txt:"Il porte plainte : contrôle du bruit la semaine suivante."}]},
 exconjoint:{t:"L'ex qui cherche quelqu'un",d:"Un homme très tendu veut entrer : « Mon ex est à l'intérieur avec un autre, je veux juste lui parler. » Il serre les poings.",
  o:[{t:"Refuser l'entrée calmement, prévenir discrètement l'équipe de salle pour qu'elle protège la femme et lui propose de partir en sécurité, appeler le 17 s'il reste",s:8,r:5,g:"Risque de violence conjugale : on ne le laisse pas entrer, on protège la personne visée."},
   {t:"Le laisser entrer, il veut juste parler",s:-12,r:-6,f:"Homme menaçant admis pour retrouver son ex-compagne.",law:"Les violences conjugales commencent souvent par ce genre de « discussion ». Le refus pour comportement menaçant est légitime."}]},
 fauxvip:{t:"« Je suis sur la liste »",d:"Une femme très sûre d'elle affirme être sur la liste VIP, invitée « par Max, l'associé du patron ». Son nom n'y est pas.",
  o:[{t:"Rester poli, vérifier auprès du gérant par téléphone, et la faire passer par l'entrée normale en attendant",r:4,g:"On vérifie au lieu de céder au bluff : la liste, c'est la liste."},
   {t:"La faire passer en VIP, elle a l'air de connaître du monde",r:-3,sat:-3,txt:"Personne ne la connaît. Elle commande une bouteille à 300 € qu'elle ne paie pas."}]},
 erasmus:{t:"Le groupe Erasmus",d:"Vingt étudiants de toutes nationalités arrivent ensemble, joyeux, avec des pièces d'identité de six pays différents.",
  o:[{t:"Les contrôler un par un comme tout le monde : âge, état, tenue, et faire entrer ceux qui sont en règle",s:3,r:5,g:"Contrôle individuel, mêmes règles pour tous, quelle que soit la nationalité."},
   {t:"Refuser le groupe : « trop d'étrangers d'un coup »",r:-18,f:"Refus d'un groupe en raison de la nationalité.",law:"Discrimination fondée sur l'origine ou la nationalité (art. 225-1 et 225-2 Code pénal)."},
   {t:"Les faire tous entrer sans contrôle, ils sont sympas",s:-8,f:"Vingt personnes admises sans aucun contrôle.",law:"Le contrôle d'accès est individuel : âge, état, objets dangereux."}]},
 secoursrue:{t:"Malaise sur le trottoir",d:"Une passante s'effondre sur le trottoir d'en face. Personne ne s'arrête.",
  o:[{t:"Envoyer un agent formé : vérifier la conscience et la respiration, appeler le 15, PLS ou massage selon l'état, pendant qu'un autre garde la porte",s:8,r:6,g:"Porter secours tout en gardant la porte : bonne organisation."},
   {t:"Ne pas quitter la porte, quelqu'un va s'en occuper",s:-10,r:-6,f:"Aucun secours porté à une personne effondrée en face.",law:"Non-assistance à personne en danger (art. 223-6 Code pénal) : il suffit au moins d'alerter le 15."}]},
 amie:{t:"« Mon amie ne répond plus »",d:"Une cliente sortie fumer ne peut plus rentrer (tampon effacé) et s'inquiète : son amie, très ivre, est restée seule à l'intérieur et ne répond plus au téléphone.",
  o:[{t:"Prendre la description de l'amie, envoyer un agent la chercher, la faire raccompagner ou prendre en charge si elle va mal",s:6,r:5,g:"Une cliente vulnérable seule à l'intérieur, c'est une priorité."},
   {t:"Lui dire que sans tampon, elle repaye ou elle reste dehors",r:-5,s:-4,txt:"Son amie a été retrouvée inconsciente aux toilettes une heure après.",f:"Signalement d'une personne vulnérable ignoré."}]},
 mere17:{t:"La mère et sa fille de 17 ans",d:"Une mère veut entrer avec sa fille qui fête ses 17 ans : « Elle est avec moi, je suis responsable, c'est son anniversaire ! »",
  o:[{t:"Expliquer gentiment que l'établissement est réservé aux majeurs, même accompagnés, et refuser",r:2,g:"La consigne (18 ans) vaut aussi pour les mineurs accompagnés, et l'alcool leur reste interdit."},
   {t:"Les laisser entrer, la mère surveille",s:-4,r:-3,f:"Mineure admise malgré la consigne.",law:"Même accompagnée, une mineure ne peut pas être servie en alcool (art. L3342-1 CSP), et la consigne de l'établissement est 18 ans."}]},
 livreur:{t:"Le livreur",d:"Un livreur à vélo arrive avec des burgers commandés par un client du carré VIP. Il veut entrer pour livrer en main propre.",
  o:[{t:"Faire appeler le client pour qu'il vienne récupérer sa commande à l'entrée",r:2,g:"Personne n'entre sans contrôle, même pour cinq minutes."},
   {t:"Le laisser entrer avec son gros sac sans contrôle",s:-4,f:"Entrée d'une personne et d'un sac non contrôlés.",law:"Le contrôle d'accès s'applique à toute personne qui entre."}]},
 radiation:{t:"Demande de retrait de la liste noire",d:"Un homme exclu il y a six mois revient poliment : il s'excuse pour la bagarre et demande à être retiré de la liste noire.",
  o:[{t:"L'écouter poliment et lui dire que seul le gérant peut lever une exclusion ; prendre ses coordonnées pour transmettre",r:4,g:"Le physio applique la liste, le gérant la décide : réponse correcte et respectueuse."},
   {t:"Le faire entrer, il a l'air d'avoir changé",s:-4,txt:"Le gérant le voit au bar et te convoque.",sat:-4,f:"Exclusion levée sans l'accord de l'exploitant."},
   {t:"Le chasser en l'insultant",r:-5,txt:"Il porte plainte pour injures, et il avait l'air sincère."}]},
 scooter:{t:"Vol de scooter devant l'entrée",d:"Sous tes yeux, deux jeunes forcent l'antivol d'un scooter garé devant la boîte.",
  o:[{t:"Appeler le 17 en donnant la description, faire signe aux clients du scooter, ne pas quitter ton poste pour une poursuite",s:5,r:3,g:"Alerter et décrire : c'est le plus utile. Ta mission est la porte."},
   {t:"Les poursuivre dans la rue",s:-6,txt:"Pendant ce temps, trois personnes entrent sans contrôle.",f:"Poste abandonné."},
   {t:"Ne rien faire, ce n'est pas ton scooter",r:-3,txt:"Un client se fait voler son scooter sous le nez de l'équipe."}]},
 inspection:{t:"Contrôle de l'inspection du travail",d:"Deux inspecteurs du travail se présentent : ils veulent voir les contrats, les déclarations d'embauche et les horaires des agents.",
  o:[{t:"Les accueillir, appeler le gérant, présenter les contrats, les déclarations d'embauche et le planning",r:4,g:"Coopération totale : un contrôle bien préparé se passe sans problème."},
   {t:"Leur dire de revenir lundi, ce n'est pas le moment",r:-10,sat:-6,f:"Refus de laisser entrer l'inspection du travail.",law:"Faire obstacle à un inspecteur du travail est un délit (art. L8114-1 Code du travail)."}]},
 urine:{t:"Client qui urine sur la façade",d:"Un client ivre refoulé urine contre la façade, devant la file et les voisins.",

function lopezEv(){
 const n=C.night%5,sc=C.lopez||0;
 const base={t:"👵 Mme Lopez, la voisine",o:[]};
 if(n===0){base.d="Mme Lopez, la voisine du dessus, en robe de chambre : « Vos basses font trembler mes verres ! J'ai 78 ans, je voudrais dormir. »";
  base.o=[{t:"L'écouter, s'excuser, faire baisser les basses et lui laisser le numéro du gérant",r:3,lp:1,g:"Mme Lopez repart rassurée : « Vous au moins, vous êtes poli. »"},{t:"« Madame, c'est une boîte de nuit, fallait pas habiter là. »",r:-5,lp:-2,txt:"Mme Lopez repart vexée en notant ton nom."}]}
 if(n===1){base.d="Mme Lopez revient : « Hier matin, il y avait des bouteilles cassées et de l'urine dans ma haie ! »";
  base.o=[{t:"Promettre une ronde extérieure à la fermeture et faire ramasser les bouteilles devant chez elle",r:3,lp:1,g:"Promesse tenue : la haie est propre le lendemain matin."},{t:"« Ce ne sont pas nos clients, madame. »",r:-3,lp:-1,txt:"Elle ne te croit pas une seconde."}]}
 if(n===2){base.d=sc>=1?"Mme Lopez arrive avec une boîte : « Des madeleines pour l'équipe. C'est bien plus calme depuis que vous êtes là. »":"Mme Lopez arrive avec une pétition signée par 15 voisins contre le bruit et les nuisances.";
  base.o=sc>=1?[{t:"La remercier chaleureusement et partager les madeleines avec l'équipe",r:3,lp:1,g:"Les madeleines font le tour de l'équipe. Les bonnes relations avec le voisinage, ça se cultive."}]:[{t:"Prendre la pétition, promettre d'en parler au gérant et proposer une rencontre avec les voisins",r:2,lp:1,g:"Le dialogue s'ouvre : la pétition ne partira peut-être pas à la mairie."},{t:"Refuser de la prendre",r:-5,sat:-4,lp:-1,txt:"La pétition part à la mairie le lendemain."}]}
 if(n===3){base.d=sc>=2?"Mme Lopez passe juste dire bonsoir : « Je viens voir mon agent de sécurité préféré ! » Elle t'apporte un thé chaud.":"Mme Lopez revient avec l'adjoint au maire chargé de la tranquillité publique, pour constater les nuisances.";
  base.o=sc>=2?[{t:"Accepter le thé et discuter deux minutes",lp:1,r:2,g:"Mme Lopez est devenue la meilleure alliée de l'établissement dans le quartier."}]:[{t:"Accueillir l'adjoint, présenter les mesures prises (rondes, sas, basses réduites) et appeler le gérant",r:3,lp:1,g:"L'adjoint repart avec une bonne impression : pas de sanction pour l'instant."},{t:"Leur dire de revenir quand le gérant sera là",r:-6,sat:-5,lp:-1,txt:"Avertissement de la mairie : risque de fermeture administrative pour nuisances."}]}
 if(n===4){base.d=sc>=2?"Mme Lopez organise un pot pour remercier l'équipe : « Grâce à vous, le quartier est tranquille. » Le gérant est invité.":"Mme Lopez a porté plainte pour tapage nocturne. Un policier vient prendre la déposition du responsable.";
  base.o=sc>=2?[{t:"Y passer avec l'équipe et le gérant",r:5,sat:5,lp:1,g:"Le gérant découvre que sa sécurité a aussi réglé ses problèmes de voisinage. Il est ravi."}]:[{t:"Répondre calmement au policier et expliquer les mesures prises",r:-2,sat:-4,txt:"La plainte suit son cours. Les nuisances, ça se prévient dès le premier jour."}]}
 return base;
}

function doorEvent(k){
 if(k==="lopez")DOOR_EV.lopez=lopezEv();
 if(k==="martin")DOOR_EV.martin=martinEv();
 S.doorDone.push(S.qi);
 const e=DOOR_EV[k];
 if(e.special==="controle"){
  const bad=C.team.filter(a=>a.carte!=="ok");
  openModal(`<h2>🚓 ${e.t}</h2><p>${e.d}</p>${bad.length?`<div class="result n">Problème : ${bad.map(a=>`<b>${a.name}</b> (carte ${a.carte==="exp"?"expirée":"inexistante"})`).join(", ")} est en service.</div>`:`<div class="result">Toute ton équipe a une carte valide.</div>`}
  <button class="btn" onclick="ctrlDo(0)">Présenter les cartes de toute l'équipe</button>${bad.length?`<button class="btn" onclick="ctrlDo(1)">Envoyer discrètement ${bad[0].name} « aider en cuisine »</button>`:""}`);
  return;
 }
 openModal(`<h2>${e.t}</h2><p>${e.d}</p>${shuffle(e.o.map((o,i)=>i)).map(i=>`<button class="btn" onclick="doorEvDo('${k}',${i})">${lbl(e.o[i].t)}</button>`).join("")}`);
}
function ctrlDo(hide){
 mc("Porte — contrôle police + CNAPS des cartes professionnelles");
 const bad=C.team.filter(a=>a.carte!=="ok");let html="";
 if(!bad.length){S.rep+=3;good("Contrôle CNAPS : toute l'équipe en règle.");html=`<div class="result">Contrôle sans problème. Le contrôleur te félicite pour le registre bien tenu.</div>`}
 else if(hide){S.rep-=15;C.sat-=12;fault(`Tentative de cacher ${bad[0].name} (sans carte) lors du contrôle.`,"Les agents ont été comptés à l'arrivée : la dissimulation aggrave tout. Travail sans carte professionnelle (CSI art. L612-20) et obstacle au contrôle.");html=`<div class="result b">Le policier avait compté les agents en arrivant. Procès-verbal pour emploi d'agent sans carte <b>et</b> pour obstacle au contrôle.</div>`}
 else{S.rep-=8;C.sat-=8;bad.forEach(a=>fault(`${a.name} en service sans carte professionnelle valide.`,"Code de la sécurité intérieure (art. L612-20 et suivants) : carte CNAPS obligatoire. Procédure contre l'employeur, l'agent doit cesser immédiatement."));html=`<div class="result b">Procès-verbal. ${bad.map(a=>a.name).join(", ")} doit quitter son poste immédiatement.</div>`;
  C.team=C.team.filter(a=>a.carte==="ok");if(C.team.length<1)C.team.push(genAgent({carte:"ok"}))}
 openModal(`<h2>Résultat du contrôle</h2>${html}<button class="btn main" onclick="closeModal();render()">Client suivant</button>`);
}
function doorEvDo(k,i){
 const o=DOOR_EV[k].o[i];if(o.lp)C.lopez=(C.lopez||0)+o.lp;if(o.mt)C.martin=(C.martin||0)+o.mt;
 if(o.sat)C.sat=clamp(C.sat+o.sat,0,100);
 if(k==="pourboire"&&o.g)S.incorr=true;
 S.secu=clamp(S.secu+(o.s||0),0,100);S.rep=clamp(S.rep+(o.r||0),0,100);
 if(o.f)fault(`${DOOR_EV[k].t} : ${o.f}`,o.law||"");if(o.g)good(`${DOOR_EV[k].t} : ${o.g}`);
 mc(`Porte — ${DOOR_EV[k].t} : ${o.t.split(",")[0].toLowerCase()}`);
 let dc="";if(o.g&&chance(.25)){const x=pick([{t:"…mais ça a pris du temps : la file s'impatiente et deux groupes partent.",r:-2},{t:"…mais la personne revient plus tard, encore plus énervée.",r:-1,ev:"revanche"},{t:"…le gérant aurait préféré qu'on fasse autrement, et il te le fait savoir.",sat:-2}]);S.rep=clamp(S.rep+(x.r||0),0,100);if(x.sat)C.sat=clamp(C.sat+x.sat,0,100);if(x.ev)schedEv(x.ev);dc=`<div class="result n">⚠️ ${x.t}</div>`}
 openModal(`<h2>${o.g?"Bien géré":"Aïe"}</h2><div class="small" style="margin-bottom:6px">Ton choix : ${o.t}</div><div class="result ${o.g?"":"b"}">${o.g||o.txt||o.f}</div>${dc}${DOOR_EV[k].note?`<div class="small" style="margin-top:8px;padding:8px;border-radius:8px;background:#1a1726;border:1px dashed #b77bff">📌 <b>Inspiré de faits réels :</b> ${DOOR_EV[k].note}</div>`:""}${o.f&&o.txt?`<div class="result b">${o.f}</div>`:""}${o.law?`<div class="law">⚖️ ${o.law}</div>`:""}<button class="btn main" onclick="closeModal();render()">Client suivant</button>`);
}

   {t:"La laisser, elle a l'air plus âgée",s:-4,r:-6,f:"Mineure servie en alcool dans l'établissement.",law:"Art. L3342-1 Code de la santé publique : 7 500 € d'amende.",b:2}],
  fail:{r:-6,f:"Mineure restée et servie en alcool toute la nuit."}},
 cigarette:{t:"Cigarette sur la piste",zones:["piste","vip"],dl:22,desc:"Un client allume une cigarette au milieu de la piste.",
  o:[{t:"Lui rappeler poliment l'interdiction et l'envoyer au fumoir",r:2,g:"Interdiction de fumer dans les lieux publics fermés : un rappel courtois suffit.",b:6},
   {t:"Le mettre dehors sur-le-champ",r:-3,txt:"Réaction excessive pour une première fois : il fait un scandale.",b:8}],
  fail:{r:-2,txt:"D'autres l'imitent, l'alarme incendie manque de se déclencher."}},
 ghb:{t:"Soupçon de GHB",zones:["bar","piste"],dl:20,q:"sst",desc:"Une cliente devient soudain confuse et ne tient plus debout après un verre. Son amie jure qu'elle n'a presque rien bu. Un homme qui lui avait offert le verre s'éloigne.",
  o:[{t:"La mettre à l'abri avec son amie, appeler le 15, garder le verre pour la police, faire surveiller l'homme et prévenir le 17",s:8,r:6,g:"Exactement ça : secours, preuve conservée, suspect repéré.",b:20,q:1},
   {t:"La faire sortir prendre l'air seule",s:-12,r:-8,f:"Personne vulnérable laissée seule dehors.",law:"Non-assistance à personne en danger (art. 223-6 Code pénal). Une personne droguée est une proie facile.",b:6},
   {t:"Lui dire qu'elle a trop bu et qu'elle doit partir",s:-8,r:-8,f:"Signes d'une soumission chimique ignorés.",law:"Administrer une substance à quelqu'un à son insu est un délit (art. 222-15-1 Code pénal) ; la victime doit être secourue, pas exclue.",b:4}],
  fail:{s:-14,r:-12,txt:"La cliente a été retrouvée inconsciente sur le parking.",f:"Victime présumée de soumission chimique non prise en charge."}},
 feu:{t:"Début de feu",zones:["vestiaire","bar"],dl:18,q:"ssiap",desc:"De la fumée sort du local poubelles derrière le bar. On voit des flammes dans un conteneur.",
  o:[{t:"Donner l'alerte, attaquer avec l'extincteur adapté si le feu reste petit, préparer l'évacuation, appeler le 18",s:10,r:3,g:"Alerte, attaque avec le bon extincteur, évacuation prête : la doctrine incendie.",b:16,q:1},
   {t:"Jeter des seaux d'eau du bar dessus",s:-4,txt:"Le conteneur est près d'une prise électrique, l'eau fait sauter le disjoncteur : panique dans le noir.",b:10},
   {t:"Ne rien dire pour ne pas affoler les clients",s:-14,f:"Feu caché au public et aux secours.",law:"Règlement de sécurité incendie des ERP : alerte et appel des sapeurs-pompiers sans délai.",b:4}],
  fail:{s:-20,r:-12,txt:"Le feu a pris dans le local, évacuation en catastrophe, deux intoxiqués.",f:"Départ de feu non traité."}},
 chute:{t:"Chute dans l'escalier",zones:["vip"],dl:22,q:"sst",desc:"Une cliente a chuté dans l'escalier du carré VIP. Elle se plaint du cou et ne sent plus bien ses doigts.",
  o:[{t:"Ne pas la bouger, lui maintenir la tête, appeler le 15, baliser l'escalier",s:8,r:4,g:"Suspicion de lésion du rachis : immobiliser et alerter. Parfait.",b:18,q:1},
   {t:"La relever et l'asseoir au bar",s:-10,f:"Victime bougée alors qu'une lésion de la colonne était possible.",law:"Gestes de secours : on ne déplace pas une victime qui se plaint du cou.",b:6}],
  fail:{s:-8,r:-6,txt:"Des clients l'ont relevée eux-mêmes… elle repart en ambulance."}},
 exterieur:{t:"Rixe devant l'entrée",zones:["porte"],dl:20,desc:"Deux clients exclus se battent sur le trottoir juste devant l'entrée. L'un est à terre.",
  o:[{t:"Protéger l'entrée, appeler le 17 et le 15, porter secours au blessé, sans poursuivre dans la rue",s:7,r:3,g:"Sur la voie publique, c'est la police qui gère : alerte, protection, secours.",b:14},
   {t:"Sortir à trois et régler ça dans la rue",s:-8,r:-4,f:"Intervention musclée sur la voie publique.",law:"Hors de l'établissement, les agents n'ont pas de mission de maintien de l'ordre (art. L613-1 CSI).",b:12},
   {t:"Fermer la porte et attendre",s:-6,txt:"Le blessé reste au sol plusieurs minutes sans secours.",f:"Aucune alerte pour un blessé devant la porte.",law:"Non-assistance à personne en danger (art. 223-6 Code pénal).",b:3}],
  fail:{s:-8,r:-5,txt:"La rixe se termine avec un blessé grave devant ta porte."}},
 coupure:{t:"Coupure de courant",zones:["piste"],dl:20,q:"ssiap",desc:"Le courant saute : musique coupée, seul l'éclairage de sécurité reste allumé. Des cris dans la foule.",
  o:[{t:"Parler fort et calmement, rassurer, dégager les issues, prévenir le gérant ; évacuer dans le calme si ça dure",s:8,r:4,g:"Le calme évite la bousculade : l'éclairage de sécurité est fait pour ça.",b:12,q:1},
   {t:"Crier « Tout le monde dehors ! »",s:-10,r:-4,f:"Ordre d'évacuation paniqué : bousculade dans l'escalier.",law:"L'évacuation doit être organisée (règlement de sécurité ERP) : ne jamais déclencher de panique.",b:8},
   {t:"Attendre sans rien dire",s:-5,txt:"Les clients allument leurs téléphones et se ruent vers le vestiaire.",b:4}],
  fail:{s:-8,r:-5,txt:"Bousculade dans le noir, deux personnes piétinées."}},
 verre:{t:"Coupure sur verre brisé",zones:["piste","bar"],dl:22,q:"sst",desc:"Une bouteille s'est brisée sur la piste. Une cliente saigne abondamment de la main.",
  o:[{t:"Comprimer la plaie avec un tissu propre, appeler le 15 si ça saigne beaucoup, faire nettoyer et baliser la zone",s:7,r:3,g:"Compression directe et zone sécurisée : bonne réaction.",b:14,q:1,gl:1},
   {t:"Lui donner des serviettes en papier et retourner à son poste",s:-5,r:-3,txt:"Elle s'évanouit dix minutes plus tard aux toilettes.",b:3},
   {t:"Ramasser d'abord les débris à mains nues",s:-4,txt:"L'agent se coupe à son tour.",b:6,gl:-1}],
  fail:{s:-6,r:-4,txt:"Les débris restent sur la piste : trois autres coupures."}},
 overdose:{t:"Convulsions",zones:["fumoir","toilettes"],dl:16,q:"sst",desc:"Un client convulse, mâchoires serrées. Son ami avoue qu'il a pris « un truc » en plus de l'alcool.",
  o:[{t:"Écarter les objets dangereux, ne rien mettre dans sa bouche, appeler le 15 en donnant les produits pris, PLS après la crise",s:9,r:3,g:"Protéger, alerter avec toutes les infos, PLS après la crise : parfait.",b:20,q:1},
   {t:"Le maintenir fermement au sol pour arrêter les convulsions",s:-6,f:"On ne bloque pas une personne qui convulse (risque de blessures).",law:"Gestes de premiers secours : protéger sans contraindre.",b:10},
   {t:"Le faire sortir discrètement pour éviter la police",s:-15,r:-6,f:"Personne en danger vital cachée aux secours.",law:"Non-assistance à personne en danger (art. 223-6 Code pénal).",b:6}],
  fail:{s:-15,r:-10,txt:"Les pompiers arrivent tard, il part en réanimation."}},
 arret:{t:"Arrêt cardiaque",zones:["piste","vip","bar"],dl:14,q:"sst",desc:"Un homme d'une cinquantaine d'années s'effondre près du bar. Il ne respire plus.",
  o:[{t:"Faire appeler le 15, commencer le massage cardiaque immédiatement, faire apporter le défibrillateur",s:10,r:6,g:"Appel, massage, défibrillateur : la chaîne de survie.",b:24,q:1,dae:1},
   {t:"Le mettre en PLS et attendre les pompiers",s:-12,f:"PLS sur une personne qui ne respire pas : il fallait masser.",law:"Arrêt cardiaque : massage cardiaque + défibrillateur sans attendre.",b:12},
   {t:"Lui jeter de l'eau froide au visage",s:-12,f:"Minutes vitales perdues.",law:"Chaque minute sans massage réduit les chances de survie d'environ 10 %.",b:8}],
  fail:{s:-25,r:-15,txt:"Personne n'a commencé le massage à temps. Il est décédé.",f:"Arrêt cardiaque sans prise en charge."}},
 bombe:{t:"Alerte à la bombe",zones:["porte"],dl:22,desc:"Le gérant reçoit un appel anonyme : « une bombe va sauter dans 30 minutes ». Il te demande quoi faire.",
  o:[{t:"Appeler le 17 immédiatement, suivre ses consignes, préparer une évacuation calme par toutes les issues",s:8,r:2,g:"C'est à la police d'évaluer la menace ; toi tu prépares une évacuation sans panique.",b:16},
   {t:"Fouiller la salle avec l'équipe sans prévenir personne",s:-8,f:"Pas d'alerte aux autorités.",law:"Toute menace doit être signalée au 17 ; ne jamais toucher un objet suspect.",b:12},
   {t:"Ignorer, c'est sûrement une blague",s:-10,f:"Menace ignorée.",law:"On ne décide pas seul qu'une menace est fausse : alerte au 17 obligatoire.",b:2}],
  fail:{s:-10,r:-5,txt:"La police arrive, alertée par un client… et découvre que rien n'a été fait."}},
 agentagresse:{t:"Agent pris à partie",zones:["piste","fumoir","bar"],dl:16,desc:"Un groupe encercle un de tes agents et le bouscule. L'un d'eux cherche la bagarre.",
  o:[{t:"Envoyer du renfort, faire reculer l'agent vers une zone dégagée, appeler le 17",s:8,r:2,g:"Renfort, repli, alerte : on protège l'équipe sans faire monter la tension.",b:16},
   {t:"Sortir une bombe lacrymogène et gazer le groupe",s:-10,r:-8,f:"Agent armé d'une bombe lacrymogène en discothèque.",law:"Les agents de sécurité privée ne peuvent être armés que dans des cas très encadrés (art. L613-5 CSI), pas en discothèque. Le gaz blesse aussi les clients.",b:12},
   {t:"Laisser ton agent se débrouiller",s:-10,txt:"Ton agent est frappé : 10 jours d'arrêt de travail.",b:4}],
  fail:{s:-12,r:-5,txt:"Ton agent est blessé, il ne pourra plus travailler cette nuit."}},
 issue:{t:"Issue de secours ouverte",zones:["secours"],dl:22,desc:"Un client a ouvert l'issue de secours pour faire entrer cinq potes sans payer.",
  o:[{t:"Refermer l'issue, faire ressortir les entrants par l'entrée principale, vérifier le comptage",s:6,r:2,g:"Jauge et comptage préservés, issue refermée.",b:12},
   {t:"Bloquer l'issue avec un cadenas pour la nuit",s:-12,f:"Issue de secours verrouillée.",law:"Interdit : une issue de secours doit pouvoir s'ouvrir de l'intérieur à tout moment (règlement de sécurité ERP).",b:6},
   {t:"Laisser, ils ont l'air sympas",s:-5,txt:"Jauge faussée, et l'un d'eux est sur la liste noire.",b:2}],
  fail:{s:-6,txt:"Une dizaine d'entrées gratuites et non comptées."}},
 terrasse:{t:"Terrasse qui déborde",zones:["fumoir"],dl:24,desc:"Après le but, la terrasse déborde sur le trottoir, des clients chantent et bloquent la rue.",
  o:[{t:"Faire revenir les clients dans le périmètre autorisé de la terrasse, faire baisser le volume, rappeler l'heure de fermeture",s:4,r:5,g:"La terrasse a un périmètre autorisé par la mairie : on le fait respecter poliment.",b:10},
   {t:"Laisser faire, c'est la fête",r:-6,f:"Occupation du trottoir au-delà de l'autorisation et nuisances.",law:"Amende possible, et fermeture administrative en cas de nuisances répétées (art. L3332-15 CSP).",b:2},
   {t:"Repousser les clients physiquement vers l'intérieur",s:-4,r:-4,f:"Usage de la force sur le trottoir.",law:"Sur la voie publique, les agents n'ont pas de mission de maintien de l'ordre (art. L613-1 CSI).",b:8}],
  fail:{r:-6,txt:"La police municipale verbalise l'établissement."}},
 baignade:{t:"Bain de minuit",zones:["secours"],dl:16,q:"sst",desc:"Un client très alcoolisé court vers la mer pour « un bain de minuit ». Ses amis rigolent.",
  o:[{t:"L'arrêter avant l'eau en lui parlant, le ramener à ses amis ; s'il est déjà dans l'eau, appeler le 196 (secours en mer) et lancer une bouée",s:9,r:4,g:"Alcool + nuit + mer = noyade. On arrête avant, et en mer on alerte (196 / 112).",b:16,q:1},
   {t:"Plonger seul pour aller le chercher",s:-8,f:"Sauvetage improvisé de nuit, sans moyens.",law:"Risque de deux noyés au lieu d'un : alerter et lancer une bouée.",b:20},
   {t:"Le laisser, il est majeur",s:-14,r:-8,f:"Personne en danger laissée sans aide.",law:"Non-assistance à personne en danger (art. 223-6 Code pénal).",b:2}],
  fail:{s:-20,r:-12,txt:"Repêché en hypothermie par des passants, évacué par les pompiers."}},
 foule:{t:"Mouvement de foule",zones:["piste","vip"],dl:18,desc:"Le DJ annonce son dernier morceau : la foule pousse vers la scène, des gens sont écrasés contre les barrières.",
  o:[{t:"Faire couper la musique via le DJ, annoncer au micro de reculer, sortir les personnes écrasées par les côtés",s:10,r:3,g:"Couper le son et parler au micro : le geste qui arrête une poussée de foule.",b:14},
   {t:"Pousser la foule en arrière à plusieurs agents",s:-8,f:"Pousser une foule compacte aggrave l'écrasement.",law:"La régulation de foule se fait par l'information et la baisse de pression, jamais par la force.",b:10},
   {t:"Attendre la fin du morceau",s:-10,txt:"Une cliente fait un malaise contre la barrière.",b:4}],
  fail:{s:-14,r:-8,txt:"Plusieurs personnes blessées contre les barrières."}},
 faux:{t:"Panique : un pistolet ?!",zones:["piste"],dl:16,desc:"Un client hurle « il y a un flingue ! » : une des futures mariées brandit un pistolet en plastique pour une photo. Des gens se jettent au sol.",
  o:[{t:"S'approcher calmement, vérifier que c'est un jouet, le récupérer pour le vestiaire, faire annoncer au micro que tout va bien",s:8,r:3,g:"Levée de doute rapide et annonce rassurante : la panique retombe.",b:10},
   {t:"Plaquer la femme au sol",s:-6,r:-8,f:"Usage de la force sur une cliente qui tenait un jouet.",law:"La force doit être nécessaire et proportionnée (art. 122-5 Code pénal) : vérifier d'abord.",b:10},
   {t:"Faire évacuer toute la salle",s:-6,r:-5,txt:"Évacuation inutile, bousculade dans l'escalier, soirée gâchée.",b:12}],
  fail:{s:-10,r:-6,txt:"Quelqu'un a appelé la police : intervention armée en pleine salle pour… un jouet."}},
 fuite:{t:"Fuite d'eau aux toilettes",zones:["toilettes"],dl:24,desc:"Un lavabo arraché : l'eau coule sur le carrelage jusque dans le couloir, près d'une multiprise.",
  o:[{t:"Couper l'arrivée d'eau, faire couper l'électricité de la zone, baliser le sol glissant, prévenir le gérant",s:7,r:2,g:"Eau + électricité : on coupe tout, on balise. Réflexe sécurité.",b:12},
   {t:"Mettre des serviettes par terre et continuer",s:-5,txt:"Une cliente glisse et se fracture le poignet.",b:4},
   {t:"Fermer les toilettes à clé toute la nuit sans rien dire",s:-2,r:-4,txt:"Les clients vont uriner dehors… et contre l'issue de secours.",b:3}],
  fail:{s:-8,txt:"Court-circuit : coupure de courant dans toute la zone et une cliente blessée en glissant."}},
 objet:{t:"Sac abandonné",zones:["piste","bar","vestiaire"],dl:22,desc:"Un sac à dos noir est posé contre un pilier depuis une heure. Personne ne le réclame. Le plan Vigipirate est au niveau « urgence attentat ».",
  o:[{t:"Ne pas le toucher, faire un appel au micro pour retrouver le propriétaire, éloigner les clients autour, appeler le 17 si personne ne se manifeste",s:8,r:2,g:"Colis suspect : on ne touche pas, on éloigne, on alerte. La police décide de la suite.",b:14},
   {t:"L'ouvrir pour voir ce qu'il y a dedans",s:-10,f:"Manipulation d'un colis suspect.",law:"Consigne Vigipirate : ne jamais toucher ni ouvrir un objet suspect, alerter le 17.",b:8},
   {t:"Le déposer au vestiaire avec les objets trouvés",s:-6,f:"Colis suspect déplacé au milieu des vêtements.",law:"On ne déplace pas un objet suspect : périmètre et alerte.",b:6}],
  fail:{s:-8,r:-4,txt:"Un client affolé crie « une bombe ! » : bousculade vers la sortie. C'était un sac oublié… mais trois blessés légers."}},
 epilepsie:{t:"Crise d'épilepsie",zones:["piste"],dl:16,q:"sst",desc:"Sous les stroboscopes, une cliente s'effondre et convulse. Ses amies hurlent.",
  o:[{t:"Faire couper les stroboscopes, écarter la foule et les objets, protéger sa tête sans la maintenir, chronométrer la crise, appeler le 15, PLS après",s:9,r:4,g:"Couper la cause, protéger sans contraindre, chronométrer : gestes parfaits.",b:18,q:1},
   {t:"Lui mettre quelque chose dans la bouche pour qu'elle ne avale pas sa langue",s:-8,f:"Objet mis dans la bouche pendant une crise.",law:"Idée reçue dangereuse : on ne met rien dans la bouche (dents cassées, étouffement).",b:10},
   {t:"La porter dehors immédiatement",s:-6,f:"Personne en crise déplacée.",law:"Pendant la crise, on protège sur place ; on ne transporte pas.",b:8}],
  fail:{s:-10,r:-5,txt:"Elle s'est cogné la tête contre une marche pendant la crise."}},
 coma:{t:"Défi des 10 shots",zones:["bar","vip"],dl:16,q:"sst",desc:"Un groupe filme un jeune qui vient d'enchaîner 10 shots pour un défi. Il s'effondre, ne réagit presque plus et vomit.",
  o:[{t:"PLS, appeler le 15 en précisant l'alcool ingéré, rester avec lui, et faire arrêter le service au groupe",s:9,r:4,g:"Coma éthylique possible : PLS, 15, surveillance. Et on arrête la source.",b:20,q:1},
   {t:"Lui faire boire du café salé pour le faire vomir",s:-10,f:"Faire vomir une personne à moitié inconsciente.",law:"Risque d'étouffement : aucun remède de grand-mère, seulement PLS et 15.",b:8},
   {t:"Le laisser cuver sur une banquette",s:-12,f:"Personne en coma éthylique laissée sans surveillance.",law:"Non-assistance à personne en danger (art. 223-6 Code pénal).",b:4}],
  fail:{s:-16,r:-10,txt:"Retrouvé inconscient une heure plus tard : réanimation."}},
 racket:{t:"Racket aux toilettes",zones:["toilettes"],dl:18,desc:"Un jeune client sort des toilettes en tremblant : trois types l'ont coincé et lui ont pris 80 € et sa montre.",
  o:[{t:"Mettre la victime à l'abri, repérer le groupe, le retenir à la sortie sans violence avec plusieurs agents, appeler le 17",s:7,r:6,g:"Extorsion en flagrant délit : on protège la victime, on retient les auteurs pour la police.",b:18},
   {t:"Aller récupérer l'argent de force dans leurs poches",s:-6,r:-4,f:"Fouille et reprise de force.",law:"Même pour rendre l'argent, pas de fouille : c'est la police qui saisit.",b:12},
   {t:"Dire au jeune de porter plainte demain",s:-4,r:-6,txt:"Le groupe recommence sur un autre client une heure plus tard.",b:2}],
  fail:{s:-8,r:-8,txt:"Le groupe a racketté deux autres clients avant de partir."}},
 serveuse:{t:"Serveuse harcelée",zones:["vip"],dl:20,desc:"Au carré VIP, un gros client met la main aux fesses d'une serveuse à chaque passage. Elle vient te voir en larmes.",
  o:[{t:"Retirer la serveuse du carré, signifier au client qu'il est exclu, lui proposer de porter plainte, prévenir le gérant",s:6,r:6,g:"Le personnel aussi doit être protégé : l'employeur a une obligation de sécurité envers ses salariés.",b:14,sat:-2},
   {t:"Lui demander de supporter, c'est un très gros client",r:-10,f:"Agression sexuelle sur une salariée tolérée.",law:"Agression sexuelle (art. 222-22 Code pénal) et obligation de sécurité de l'employeur (Code du travail).",b:2},
   {t:"Lui dire de changer de zone et ne rien dire au client",r:-5,txt:"Le client recommence avec une autre serveuse.",b:4}],
  fail:{r:-8,txt:"La serveuse a démissionné le lendemain et porte plainte contre l'établissement."}},
 laser:{t:"Pointeur laser",zones:["piste"],dl:22,desc:"Un client s'amuse à pointer un laser vert puissant dans les yeux du DJ et des danseurs.",
  o:[{t:"Lui demander de le ranger et de le déposer au vestiaire jusqu'à la sortie ; exclusion s'il recommence",s:5,r:3,g:"Les lasers puissants peuvent brûler la rétine : on retire l'objet par la discussion.",b:8},
   {t:"Lui arracher le laser des mains",s:-2,r:-3,txt:"Il crie au vol devant tout le monde.",b:6},
   {t:"Laisser, ça fait partie du show",s:-6,txt:"Le DJ a une tache dans l'œil : consultation en urgence ophtalmo.",b:2}],
  fail:{s:-5,r:-3,txt:"Un danseur a été ébloui et est tombé de son podium."}},
 live:{t:"Live sur les réseaux",zones:["piste","vip"],dl:24,desc:"Une influenceuse filme en direct les clients de près, se moque d'eux et zoome sur une cliente qui ne veut pas être filmée.",
  o:[{t:"Lui demander poliment d'arrêter de filmer les personnes qui refusent, rappeler le règlement intérieur, exclure si elle continue",r:5,g:"Droit à l'image des clients : on fait respecter le règlement par le dialogue.",b:8},
   {t:"Lui prendre le téléphone",r:-8,f:"Téléphone saisi de force.",law:"On ne s'empare jamais du bien d'un client : vol ou violence.",b:6},
   {t:"Laisser faire, c'est de la pub gratuite",r:-6,txt:"La cliente filmée porte plainte pour atteinte à son droit à l'image.",b:2}],
  fail:{r:-6,txt:"La vidéo moqueuse fait 200 000 vues. Plusieurs clients ne reviendront pas."}},
 fumigene:{t:"Fumigène dans la fosse",zones:["piste"],dl:16,desc:"Des fans allument un fumigène rouge au milieu de la fosse. Fumée épaisse, des gens toussent.",
  o:[{t:"Faire évacuer la zone autour, faire couper le concert, éteindre le fumigène dans un seau de sable, ventiler, repérer l'auteur",s:8,r:2,g:"Pyrotechnie en lieu clos : on met les gens à distance, on neutralise, on ventile.",b:14},
   {t:"Le prendre à mains nues pour le jeter dehors",s:-6,txt:"Ton agent se brûle sérieusement la main.",f:"Fumigène manipulé sans protection (plus de 1 000 °C).",law:"Un fumigène se neutralise dans le sable ou un seau, avec des gants, pas à la main.",b:16,gl:-1},
   {t:"Laisser brûler, ça va s'éteindre",s:-12,txt:"La fumée déclenche l'alarme : évacuation générale en panique.",b:2}],
  fail:{s:-14,r:-6,txt:"Intoxications à la fumée et bousculade vers la sortie."}},
 ascenseur:{t:"Clients coincés dans l'ascenseur",zones:["vestiaire"],dl:24,desc:"L'ascenseur qui monte au toit est bloqué entre deux étages avec six clients dedans. L'une d'elles panique.",
  o:[{t:"Leur parler par l'interphone pour les rassurer, appeler le dépanneur d'ascenseur, appeler le 18 si quelqu'un fait un malaise, ne pas forcer les portes",s:7,r:3,g:"On rassure et on appelle les professionnels : jamais de désincarcération improvisée.",b:16},
   {t:"Forcer les portes avec un pied-de-biche",s:-12,f:"Ouverture forcée d'une cabine bloquée entre deux étages.",law:"Risque de chute dans la gaine : seuls l'ascensoriste ou les pompiers interviennent.",b:12}],
  fail:{s:-6,r:-6,txt:"Une heure bloqués sans nouvelles : malaise d'une cliente, pompiers appelés en urgence."}},
 jackpot:{t:"Litige au jackpot",zones:["piste"],dl:24,desc:"Un joueur hurle que la machine lui doit 5 000 € : l'écran a affiché un gain puis s'est éteint. Il refuse de quitter la machine.",
  o:[{t:"Faire appeler le directeur des jeux et le technicien, sécuriser la machine (personne n'y touche), rester calme auprès du joueur",s:6,r:4,g:"Litige de jeu : la direction des jeux et le contrôle des machines tranchent, la sécurité garde la machine en l'état.",b:14},
   {t:"Débrancher la machine pour régler le problème",s:-4,r:-6,f:"Preuve du litige effacée.",law:"Les machines sont sous contrôle réglementaire : on ne touche à rien avant vérification.",b:6},
   {t:"Le sortir du casino parce qu'il crie",r:-6,txt:"Il revient avec un avocat, et l'histoire fait la une du journal local.",b:10}],
  fail:{r:-6,txt:"Le joueur a cassé l'écran de la machine."}},
 feucamp:{t:"Feu de camp sur la plage",zones:["secours"],dl:22,desc:"Des clients ont allumé un feu avec des palettes sur la plage, juste derrière les paillotes en bois. Le vent souffle.",
  o:[{t:"Faire éteindre le feu avec les extincteurs et du sable, éloigner les clients, prévenir le gérant",s:7,r:2,g:"Feu sauvage près de structures en bois par vent fort : on éteint tout de suite.",b:12},
   {t:"Laisser, c'est l'ambiance plage",s:-10,f:"Feu toléré près des installations.",law:"Les feux sur la plage sont en général interdits par arrêté, et la paillote est un ERP à protéger.",b:2}],
  fail:{s:-16,r:-8,txt:"Une paillote a pris feu. Les pompiers interviennent."}},
 cave:{t:"Client dans la cave",zones:["vestiaire"],dl:22,desc:"Un client éméché est descendu à la cave par l'escalier raide « pour chercher des toilettes ». On entend du bruit de casse.",
  o:[{t:"Descendre le chercher en allumant tout, vérifier qu'il n'est pas blessé, le remonter, fermer la cave à clé",s:6,r:2,g:"Zone interdite au public : on récupère la personne et on sécurise l'accès.",b:10},
   {t:"Fermer la porte de la cave à clé avec lui dedans pour lui « donner une leçon »",s:-12,f:"Client enfermé volontairement.",law:"Séquestration (art. 224-1 Code pénal) : on n'enferme jamais quelqu'un.",b:2}],
  fail:{s:-8,txt:"Il est tombé dans l'escalier de la cave : poignet cassé, et il a vidé deux bouteilles."}},
 barman:{t:"Le barman sert trop",zones:["bar"],dl:26,desc:"Un barman enchaîne les tournées de shots offertes à un groupe déjà très éméché : « c'est des potes ».",
  o:[{t:"Lui demander d'arrêter le service à ce groupe, informer le gérant, proposer de l'eau au groupe",s:6,r:2,g:"Servir une personne ivre engage l'établissement : l'agent alerte, le gérant tranche.",b:10},
   {t:"Ne rien dire, ce n'est pas ton rôle",s:-6,f:"Personnes manifestement ivres resservies sous tes yeux.",law:"Code de la santé publique : interdit de servir une personne manifestement ivre. C'est l'établissement qui en répond.",b:2},
   {t:"Engueuler le barman devant les clients",r:-4,txt:"Clash public entre employés, le gérant n'apprécie pas du tout.",b:6}],
  fail:{s:-6,txt:"Le groupe finit ivre mort : un malaise et une bagarre plus tard."}},
 pickpockets:{t:"Pickpockets en équipe",zones:["piste","bar"],dl:22,desc:"Trois personnes frôlent les clients sur la piste ; deux sacs ont déjà été ouverts.",
  o:[{t:"Les suivre discrètement, prévenir les autres agents, appeler le 17 et les retenir à la sortie si un vol est constaté",s:7,r:4,g:"Surveillance, alerte, appréhension en flagrant délit (art. 73 Code de procédure pénale).",b:18},
   {t:"Les fouiller de force sur la piste",s:-3,r:-6,f:"Fouille forcée par des agents privés.",law:"Seuls policiers et gendarmes peuvent fouiller. L'agent appréhende en flagrant délit et attend la police.",b:10},
   {t:"Les mettre dehors sans rien dire",r:-3,txt:"Ils repartent avec trois portefeuilles.",b:6}],
  fail:{r:-7,txt:"Une dizaine de plaintes pour vol le lendemain, avis catastrophiques en ligne."}},
 evg:{t:"Enterrement de vie de garçon déchaîné",zones:["piste","vip"],dl:24,desc:"Le futur marié, en costume de bébé, est porté à bout de bras par ses potes, qui renversent tout sur leur passage.",
  o:[{t:"Parler au témoin (le plus sobre), fixer les règles : on le pose, on se calme, sinon c'est la sortie",s:4,r:5,g:"On s'appuie sur le meneur du groupe : recadrage efficace sans exclusion.",b:8},
   {t:"Les sortir tous immédiatement",r:-4,txt:"Gros groupe, grosse dépense au bar : le gérant râle, et l'exclusion était disproportionnée.",b:14},
   {t:"Les laisser faire, c'est la fête",s:-6,txt:"Le futur marié tombe et se casse le nez sur une table.",b:2}],
  fail:{s:-6,r:-3,txt:"Table renversée, deux clientes blessées par du verre."}},
 photo:{t:"Photos sous les jupes",zones:["piste","bar"],dl:20,desc:"Une cliente a surpris un homme qui glissait son téléphone sous sa jupe pour la filmer. Deux amies ont vu la scène.",
  o:[{t:"Retenir l'homme sans violence, mettre la victime à l'abri, appeler le 17 et ne pas toucher au téléphone (preuve)",s:7,r:7,g:"Voyeurisme en flagrant délit : on retient l'auteur pour la police, le téléphone est une preuve.",b:18},
   {t:"Lui prendre le téléphone et effacer les vidéos",s:-3,r:-4,f:"Preuve détruite et téléphone saisi de force.",law:"Le voyeurisme est un délit (art. 226-3-1 Code pénal). Effacer les images fait disparaître la preuve : c'est à la police de saisir le téléphone.",b:10},
   {t:"Le mettre simplement dehors",r:-6,f:"Auteur présumé d'un délit sexuel laissé repartir.",law:"Flagrant délit puni d'emprisonnement : l'auteur peut être retenu et remis à la police (art. 73 Code de procédure pénale).",b:8}],
  fail:{r:-8,txt:"L'homme est parti. La victime raconte tout sur les réseaux sociaux."}},
 vomi:{t:"Client qui vomit sur la piste",zones:["piste","bar"],dl:24,q:"sst",desc:"Un client vomit au milieu de la piste, il tient à peine debout. Ses amis s'écartent en riant.",
  o:[{t:"L'accompagner aux toilettes, le faire asseoir, lui donner de l'eau, surveiller son état, faire nettoyer et baliser la zone",s:6,r:3,g:"Prise en charge et surveillance : un client dans cet état peut vite basculer vers le coma éthylique.",b:14,q:1},
   {t:"Le sortir tout de suite sur le trottoir",s:-8,f:"Client très alcoolisé laissé seul dehors.",law:"Risque de chute, d'hypothermie ou d'étouffement : non-assistance possible (art. 223-6 Code pénal).",b:6},
   {t:"Laisser ses amis s'en occuper",s:-4,r:-3,txt:"Ses amis l'oublient dans un coin, il glisse dans son vomi et se coupe.",b:2}],
  fail:{s:-6,r:-4,txt:"Personne n'a nettoyé : trois clients ont glissé sur la piste."}},
 chaleur:{t:"Coup de chaleur",zones:["piste","vip"],dl:20,q:"sst",desc:"Il fait plus de 35 °C sur la piste. Une danseuse devient pâle, a des vertiges et des crampes.",
  o:[{t:"L'emmener dans une zone fraîche, l'allonger, lui faire boire de l'eau par petites gorgées, appeler le 15 si elle ne va pas mieux, prévenir le gérant pour la clim",s:7,r:4,g:"Fraîcheur, eau, surveillance, et on agit sur la cause.",b:14,q:1},
   {t:"Lui offrir un verre d'alcool fort pour la « remonter »",s:-8,f:"Alcool donné à une personne en malaise.",law:"L'alcool aggrave la déshydratation : gestes de secours inadaptés.",b:4}],
  fail:{s:-8,r:-4,txt:"Elle s'évanouit et se cogne la tête en tombant."}},
 angoisse:{t:"Crise d'angoisse",zones:["toilettes","fumoir","vip"],dl:22,q:"sst",desc:"Une cliente respire très vite, a des fourmis dans les mains et dit qu'elle va mourir.",
  o:[{t:"L'isoler au calme avec une amie, lui parler doucement, l'aider à ralentir sa respiration ; appeler le 15 en cas de doute",s:6,r:4,g:"Calme, réassurance et respiration lente. Et le 15 au moindre doute, car ça peut cacher autre chose.",b:14,q:1},
   {t:"Lui dire de se calmer et de rentrer chez elle",s:-6,r:-4,f:"Personne en détresse renvoyée seule.",law:"Une crise d'angoisse peut masquer une prise de drogue ou un problème cardiaque.",b:3}],
  fail:{s:-5,r:-3,txt:"Elle s'est effondrée en pleurs dans l'escalier, seule."}},
 allergie:{t:"Réaction allergique",zones:["bar","vip"],dl:16,q:"sst",desc:"Après un cocktail, un client a les lèvres et le visage qui gonflent. Il respire mal. Il dit être allergique aux fruits à coque.",
  o:[{t:"Appeler le 15 immédiatement, le faire asseoir, l'aider à utiliser son stylo d'adrénaline s'il en a un",s:9,r:5,g:"Choc allergique : le 15 tout de suite, et son auto-injecteur s'il en a un. Réflexe vital.",b:20,q:1},
   {t:"Lui donner de l'eau et attendre que ça passe",s:-14,f:"Œdème allergique non pris en charge.",law:"Une réaction allergique grave peut tuer en quelques minutes : alerte immédiate.",b:6}],
  fail:{s:-18,r:-10,txt:"Choc anaphylactique : évacué en urgence vitale par le SAMU."}},
 fauxbillets:{t:"Faux billets au bar",zones:["bar"],dl:22,desc:"La barmaid te montre un billet de 50 € sans filigrane. Le client veut en payer encore deux autres.",
  o:[{t:"Ne pas rendre le billet, rester calmement près du client, appeler le 17 et l'empêcher de partir en attendant (flagrant délit)",s:6,r:3,g:"Usage de fausse monnaie : délit, appréhension possible et remise à la police.",b:16},
   {t:"Lui rendre le billet et le mettre dehors",r:-4,txt:"Il va payer avec ses faux billets dans le bar d'à côté.",b:6},
   {t:"Le fouiller pour trouver les autres billets",s:-2,r:-4,f:"Fouille forcée.",law:"Seuls les policiers peuvent fouiller. L'agent retient l'auteur et attend la police.",b:10}],
  fail:{r:-5,txt:"Il a payé toute la soirée avec des faux billets : 300 € de perte."}},
 bouteille:{t:"Bouteille lancée",zones:["vip","piste"],dl:18,desc:"Depuis le carré VIP, un client jette une bouteille vide sur la piste. Elle explose à côté de clients.",
  o:[{t:"Identifier et exclure le lanceur en escorte à deux, vérifier s'il y a des blessés, faire nettoyer la zone",s:7,r:3,g:"Violence avec arme par destination : exclusion, soins, nettoyage. Et le 17 s'il y a un blessé.",b:14},
   {t:"Lui laisser une chance, c'est un gros client du carré",s:-8,r:-5,f:"Violence tolérée parce que le client dépense beaucoup.",law:"Une bouteille lancée sur des personnes, c'est une violence avec arme par destination (art. 222-13 Code pénal).",b:2}],
  fail:{s:-10,r:-6,txt:"Une deuxième bouteille blesse une cliente au visage."}},
 filles:{t:"Bagarre entre clientes",need:2,zones:["piste","toilettes"],dl:20,desc:"Deux clientes se tirent les cheveux et se griffent près des toilettes. Leurs amies s'en mêlent.",
  o:[{t:"Intervenir à deux, si possible avec une agente, séparer, isoler chaque groupe, faire sortir les plus agitées en décalé",s:7,r:3,g:"Même méthode que pour une bagarre d'hommes, et une agente rassure tout le monde.",b:14},
   {t:"Les laisser régler ça entre elles, c'est moins dangereux",s:-8,txt:"Un verre se brise, une cliente est coupée au visage.",b:2},
   {t:"Les jeter dehors toutes ensemble",s:-5,r:-3,txt:"La bagarre reprend aussitôt sur le trottoir.",b:10}],
  fail:{s:-8,r:-5,txt:"La bagarre s'est étendue : quatre personnes blessées."}},
 dj:{t:"Client qui menace le DJ",zones:["piste"],dl:20,desc:"Un client furieux monte sur l'estrade du DJ parce qu'il refuse de passer sa musique. Il le saisit par le col.",
  o:[{t:"Faire descendre le client en lui parlant fermement, escorte à deux hors de l'estrade, exclusion s'il continue",s:7,r:3,g:"On protège le DJ et le matériel, verbal ferme puis escorte.",b:12},
   {t:"Le tirer violemment de l'estrade",s:-6,r:-4,f:"Chute provoquée depuis une hauteur.",law:"Force disproportionnée : il tombe sur les clients en contrebas.",b:10},
   {t:"Demander au DJ de passer sa musique pour avoir la paix",r:-4,txt:"Dix autres clients montent demander leur morceau.",b:2}],
  fail:{s:-6,r:-6,txt:"Platines renversées, musique coupée 20 minutes."}},
 seringue:{t:"Seringue trouvée",zones:["toilettes"],dl:24,desc:"Un client signale une seringue usagée posée sur le rebord du lavabo.",
  o:[{t:"Mettre des gants, ramasser avec une pince sans reboucher l'aiguille, la mettre dans un contenant rigide fermé, prévenir le gérant",s:6,g:"Ne jamais reboucher une aiguille : contenant rigide et gants. Risque de VIH et d'hépatites.",b:10,gl:1},
   {t:"La jeter à la poubelle à mains nues",s:-6,txt:"Une femme de ménage se pique le lendemain matin : dépistage et traitement préventif.",f:"Déchet piquant jeté sans précaution.",b:4,gl:-1}],
  fail:{s:-8,txt:"Un client s'est piqué la main en s'appuyant sur le lavabo."}},
 police:{t:"La police entre dans la salle",zones:["porte","piste"],dl:20,desc:"Quatre policiers entrent : ils recherchent un homme soupçonné d'un vol avec violence dans la rue. Ils te demandent ton aide.",
  o:[{t:"Les accueillir, faire rallumer un peu la lumière, les guider dans la salle, donner les infos utiles et garder l'accès aux issues",s:7,r:2,g:"Coopération totale avec les forces de l'ordre : c'est ton obligation et ton intérêt.",b:14},
   {t:"Leur demander d'attendre la fin de la soirée pour ne pas gêner les clients",s:-6,r:-4,f:"Entrave à une intervention de police.",law:"Gêner une opération de police peut être poursuivi ; l'exploitant doit faciliter l'intervention.",b:4},
   {t:"Prévenir discrètement le suspect, c'est un habitué",s:-15,r:-10,f:"Avertir un suspect recherché.",law:"Recel de malfaiteur / entrave à la justice (art. 434-6 Code pénal) : faute pénale grave.",b:2}],
  fail:{s:-5,r:-4,txt:"Les policiers ont fouillé la salle seuls, dans la confusion."}},
 conjugal:{t:"Un homme frappe sa compagne",zones:["fumoir","porte"],dl:16,desc:"Au fumoir, un homme gifle violemment sa compagne et la tire par le bras vers la sortie.",
  o:[{t:"S'interposer à deux, mettre la femme à l'abri, retenir l'homme et appeler le 17 (flagrant délit)",s:9,r:7,g:"Violences conjugales en flagrant délit : protéger la victime, retenir l'auteur, alerter.",b:20},
   {t:"Ne pas s'en mêler, c'est leur histoire de couple",s:-12,r:-10,f:"Violences sous tes yeux sans intervention.",law:"Violences conjugales (art. 222-13 Code pénal) : tout témoin peut et doit agir. Ne pas empêcher un délit contre l'intégrité d'une personne est puni (art. 223-6 Code pénal).",b:2},
   {t:"Les mettre dehors tous les deux",s:-10,r:-6,f:"Victime renvoyée avec son agresseur.",law:"La victime doit être protégée, pas laissée avec l'auteur.",b:6}],
  fail:{s:-14,r:-10,txt:"Il l'a emmenée de force. Des clients ont appelé la police, qui demande pourquoi personne n'a rien fait."}},
 etincelles:{t:"Bouteille à étincelles",zones:["vip"],dl:18,q:"ssiap",desc:"Au carré VIP, des serveuses arrivent avec des bouteilles surmontées de fontaines d'étincelles. Le plafond est recouvert de mousse acoustique.",
  o:[{t:"Faire éteindre les étincelles tout de suite et prévenir le gérant : pas d'effets pyrotechniques sous ce plafond",s:9,r:1,g:"Plusieurs incendies mortels en discothèque ont commencé comme ça. Le gérant râle, mais tu as raison.",b:8,q:1},
   {t:"Laisser faire, c'est la tradition pour les grosses bouteilles",s:-12,f:"Effets pyrotechniques sous un plafond inflammable.",law:"Règlement de sécurité des ERP : flamme nue et pyrotechnie interdites sans autorisation et mesures particulières.",b:2}],
  fail:{s:-22,r:-12,txt:"Le plafond s'est enflammé : évacuation d'urgence, plusieurs intoxiqués.",f:"Départ de feu causé par des étincelles."}},
 grivelerie:{t:"Client qui ne veut pas payer",zones:["bar","vip"],dl:22,desc:"Un client a commandé une bouteille à 180 € au carré VIP et refuse maintenant de payer : « Je n'ai pas d'argent, et alors ? »",

   {t:"Lui prendre sa montre en garantie",r:-6,f:"Bien saisi de force.",law:"Personne ne peut se faire justice soi-même : ça devient du vol ou de l'extorsion.",b:8},
