  fail:{r:-3,txt:"Il est parti sans payer."}},
 homophobe:{t:"Agression homophobe",zones:["piste","fumoir"],dl:18,desc:"Deux hommes qui s'embrassaient sont insultés et bousculés par un groupe : « Pas de ça ici ! »",
  o:[{t:"Protéger le couple, exclure les agresseurs, proposer au couple d'appeler le 17 et de porter plainte, garder les témoignages",s:7,r:7,g:"Insultes et violences en raison de l'orientation sexuelle : protection des victimes et exclusion des auteurs.",b:16},
   {t:"Demander au couple d'être plus discret",r:-10,f:"Victimes traitées comme responsables.",law:"Les infractions commises en raison de l'orientation sexuelle sont aggravées (art. 132-77 Code pénal). Refuser ou restreindre un service pour ce motif est une discrimination.",b:4},
   {t:"Mettre tout le monde dehors",r:-6,s:-3,txt:"Le couple se fait agresser à nouveau sur le trottoir.",b:8}],
  fail:{s:-8,r:-10,txt:"Le couple a été frappé. Plainte, et l'établissement est cité dans la presse."}},
 podium:{t:"Chute du podium",zones:["piste","vip"],dl:20,q:"sst",desc:"Une cliente qui dansait sur un podium d'un mètre cinquante est tombée. Elle ne peut plus bouger la cheville et a mal au dos.",
  o:[{t:"Ne pas la relever, la protéger de la foule, appeler le 15, faire interdire le podium pour la suite",s:7,r:3,g:"Victime immobilisée, alerte, et on supprime le danger.",b:16,q:1},
   {t:"La relever et l'asseoir sur une banquette",s:-8,f:"Victime d'une chute de hauteur déplacée.",law:"Après une chute avec douleur au dos, on ne bouge pas la victime.",b:6}],
  fail:{s:-8,r:-5,txt:"Des clients l'ont relevée, elle repart en ambulance avec une fracture."}},
 rooftop:{t:"Client sur le garde-corps",zones:["vip"],dl:16,hard:.1,desc:"Sur la terrasse du toit, un client éméché s'est assis sur le garde-corps pour un selfie, dos au vide, à six étages.",
  o:[{t:"S'approcher calmement sans brusquer, lui parler, l'aider à redescendre côté terrasse, puis interdire l'accès à cette zone",s:8,r:3,g:"Approche calme, aide à redescendre, zone neutralisée : réflexe vital.",b:10},
   {t:"L'attraper par surprise pour le tirer en arrière",s:-10,f:"Geste brusque au bord du vide.",law:"Un sursaut peut provoquer la chute : on approche en parlant, jamais par surprise.",b:8},
   {t:"Lui crier de descendre depuis le bar",s:-4,txt:"Il sursaute, manque de basculer, ses amis le rattrapent de justesse.",b:2}],
  fail:{s:-25,r:-15,txt:"Il a perdu l'équilibre. Chute mortelle. Enquête judiciaire sur la sécurité de la terrasse.",f:"Personne en danger de chute laissée sans intervention."}},
 sacvole:{t:"Sac volé",zones:["piste","bar"],dl:22,desc:"Une cliente a vu son sac disparaître du dossier de sa chaise. La caméra du bar montre un homme en chemise blanche.",
  o:[{t:"Repérer l'homme, le garder à vue près de la sortie, appeler le 17 et lui proposer de rendre le sac",s:6,r:5,g:"Vol en flagrant délit : surveillance, appel police, appréhension possible (art. 73 Code de procédure pénale).",b:16},
   {t:"Le plaquer au sol dès qu'il est repéré",s:-6,r:-4,f:"Usage de la force sans nécessité.",law:"Retenir oui, plaquer violemment non : la force doit être nécessaire et proportionnée.",b:10},
   {t:"Conseiller à la cliente de porter plainte demain",r:-5,txt:"Le voleur repart tranquillement avec le sac.",b:2}],
  fail:{r:-6,txt:"Le voleur est reparti avec le sac."}},
 triche:{t:"Soupçon de triche",zones:["vip"],dl:24,desc:"Le chef de table signale un joueur qui marque les cartes pendant qu'un complice fait diversion.",
  o:[{t:"Ne pas intervenir seul à la table : prévenir le directeur des jeux, faire surveiller par les caméras, inviter le joueur au bureau, appeler la police si la triche est confirmée",s:6,r:4,g:"Procédure casino : la direction des jeux décide, la sécurité accompagne, la police enquête.",b:16},
   {t:"Le sortir de force et lui reprendre ses jetons",s:-4,r:-6,f:"Jetons saisis de force par la sécurité.",law:"La tricherie est une escroquerie : c'est une affaire de police. La sécurité ne confisque rien par la force.",b:10},
   {t:"Laisser jouer, ça fait du chiffre",s:-6,r:-4,f:"Tricherie tolérée.",law:"Le casino doit signaler les fraudes : il risque son autorisation de jeux.",b:2}],
  fail:{r:-6,txt:"Les tricheurs repartent avec 8 000 € de gains."}},
 perdant:{t:"Joueur ruiné en détresse",zones:["piste","bar"],dl:22,q:"sst",desc:"Un homme vient de perdre de très grosses sommes. Il pleure, puis crie qu'il va « tout casser » et qu'il « n'a plus de raison de vivre ».",

   {t:"Le mettre dehors pour qu'il arrête de crier",s:-12,r:-6,f:"Personne en détresse mise dehors seule.",law:"Non-assistance à personne en danger (art. 223-6 Code pénal).",b:6},
   {t:"Lui offrir des jetons pour le calmer",s:-6,r:-8,f:"Incitation à rejouer d'un joueur en détresse.",law:"Les casinos ont une obligation de prévention du jeu excessif.",b:4}],
  fail:{s:-12,r:-8,txt:"Il est parti seul, très mal. Sa famille contacte le casino le lendemain."}},
 slam:{t:"Slam et pogo violent",zones:["piste"],dl:18,desc:"Pendant le concert, un spectateur saute de la scène dans la fosse. Le pogo devient violent, une fille est tombée au sol.",
  o:[{t:"Faire relever immédiatement la personne au sol, la sortir par la barrière avant-scène, demander au régisseur une pause si ça continue",s:8,r:3,g:"Personne au sol = priorité absolue en fosse. La barrière avant-scène sert à ça.",b:14},
   {t:"Tirer les slameurs par les jambes pour les faire descendre",s:-8,f:"Chute provoquée sur la foule.",law:"Force inadaptée : risque de chute de hauteur sur les spectateurs.",b:10},
   {t:"Laisser faire, c'est un concert de rock",s:-10,txt:"La fille au sol est piétinée : fracture du bras.",b:2}],
  fail:{s:-12,r:-6,txt:"Une spectatrice piétinée, évacuée par les pompiers."}},
 alarme:{t:"Alarme incendie déclenchée",zones:["vestiaire","toilettes"],dl:18,q:"ssiap",desc:"L'alarme incendie retentit. Le tableau indique un détecteur déclenché côté toilettes. Sûrement une cigarette… ou pas.",
  o:[{t:"Faire la levée de doute sur place, évacuer si feu confirmé ou s'il y a un doute, prévenir le 18, ne jamais couper l'alarme sans vérifier",s:8,r:2,g:"Levée de doute puis consigne d'évacuation : la règle en ERP.",b:12,q:1},
   {t:"Couper l'alarme depuis le tableau, c'est sûrement une cigarette",s:-14,f:"Alarme neutralisée sans levée de doute.",law:"Règlement de sécurité ERP : toute alarme doit être vérifiée ; la couper à l'aveugle est une faute grave.",b:2},
   {t:"Faire évacuer tout le monde sans savoir où ça a sonné",s:-2,r:-4,txt:"Évacuation pour une cigarette : bon réflexe sur le principe, mais désorganisée et coûteuse.",b:12}],
  fail:{s:-12,r:-5,txt:"Personne n'a vérifié : le feu couvait dans un faux plafond."}},
 agentboit:{t:"Un agent boit au bar",zones:["bar"],dl:24,desc:"Le barman te prévient : un de tes agents enchaîne les verres offerts par des clients depuis une heure.",
  o:[{t:"Le retirer de son poste, le faire remplacer, le renvoyer chez lui en taxi et faire un rapport au gérant",s:6,r:2,g:"Un agent alcoolisé en service est un danger pour tous : on le retire, on le remplace, on rend compte.",b:14},
   {t:"Lui dire de ralentir et le laisser en poste",s:-8,f:"Agent alcoolisé maintenu en service.",law:"Code de déontologie de la sécurité privée : l'agent doit être apte et maître de lui pendant le service.",b:4}],
  fail:{s:-10,r:-6,txt:"Ton agent ivre a frappé un client. Plainte, et il risque sa carte professionnelle."}},
 ghbhomme:{t:"Un homme drogué à son insu",zones:["bar","piste"],dl:18,q:"sst",desc:"Un jeune homme devient soudain confus, a des trous de mémoire et ne tient plus debout. Ses amis jurent qu'il n'a bu qu'une bière.",
  o:[{t:"Le mettre à l'abri avec ses amis, appeler le 15, garder son verre pour la police et prévenir le 17",s:8,r:5,g:"La soumission chimique touche aussi les hommes : même protocole.",b:20,q:1},
   {t:"C'est un homme, il a juste trop bu : on le sort",s:-10,r:-6,f:"Signes de soumission chimique ignorés.",law:"Administrer une substance à l'insu d'une personne est un délit (art. 222-15-1 Code pénal), quel que soit le sexe de la victime.",b:6}],
  fail:{s:-12,r:-8,txt:"Retrouvé inconscient, sans portefeuille ni téléphone, sur le parking."}},
 accusation:{t:"Deux versions qui s'opposent",zones:["piste","bar"],dl:22,desc:"Une cliente accuse un homme de l'avoir agressée ; lui jure qu'il n'a rien fait. Personne n'a rien vu clairement.",
  o:[{t:"Séparer les deux, mettre la cliente à l'abri, garder l'homme sur place calmement, appeler le 17 et ne pas juger : c'est à la police d'établir les faits",s:7,r:5,g:"On protège, on préserve les faits, on alerte. L'enquête n'est pas le travail de la sécurité.",b:18},
   {t:"Croire l'homme, il a l'air sympa, et le laisser partir",s:-4,r:-8,f:"Plainte d'agression ignorée.",law:"Toute dénonciation d'agression doit être prise au sérieux et transmise à la police.",b:4},
   {t:"Frapper l'homme pour le faire avouer",s:-10,r:-8,f:"Violences sur une personne mise en cause.",law:"Violences volontaires (art. 222-11 Code pénal) : personne ne se fait justice soi-même.",b:8}],
  fail:{r:-8,txt:"L'homme est reparti. La cliente porte plainte et met en cause l'inaction de l'équipe."}},
 disparue:{t:"Une amie a disparu",zones:["piste","toilettes"],dl:22,desc:"Une cliente affolée : son amie, très ivre, est partie avec un inconnu il y a 30 minutes et ne répond plus.",
  o:[{t:"Faire le tour de toutes les zones, regarder les caméras de la sortie, demander aux agents de la porte, appeler le 17 si elle reste introuvable",s:7,r:5,g:"Recherche méthodique et alerte rapide : chaque minute compte.",b:18},
   {t:"Lui dire que son amie est majeure et fait ce qu'elle veut",s:-8,r:-8,f:"Signalement d'une personne vulnérable ignoré.",law:"Une personne très alcoolisée partie avec un inconnu peut être en danger : il faut chercher et alerter.",b:2}],
  fail:{s:-10,r:-8,txt:"Elle a été retrouvée au petit matin, en état de choc. La police enquête."}},
 gaz:{t:"Odeur de gaz",zones:["vestiaire","bar"],dl:16,q:"ssiap",desc:"Forte odeur de gaz près de la cuisine du snack. Un employé dit avoir entendu un sifflement.",
  o:[{t:"Ne toucher à aucun interrupteur, ouvrir les accès, faire évacuer dans le calme, couper le gaz à la vanne si possible, appeler le 18",s:10,r:3,g:"Fuite de gaz : zéro étincelle, évacuation, coupure, pompiers. Parfait.",b:16,q:1},
   {t:"Allumer la lumière de la cuisine pour trouver la fuite",s:-16,f:"Interrupteur actionné dans une atmosphère gazeuse.",law:"Une étincelle peut provoquer une explosion : on ne touche à rien d'électrique.",b:10}],
  fail:{s:-22,r:-12,txt:"Explosion dans la cuisine. Deux employés brûlés, établissement fermé."}},
 garde:{t:"Le garde du corps",zones:["vip","piste"],dl:20,desc:"Le garde du corps d'un rappeur connu bouscule violemment les clients qui veulent faire un selfie et en jette un par terre.",
  o:[{t:"Aller voir le garde du corps calmement, rappeler qu'il n'a pas plus de droits que quiconque, proposer de créer un périmètre avec ton équipe, s'occuper du client tombé",s:7,r:4,g:"Un garde du corps privé n'a aucun pouvoir sur les autres clients : on coopère, mais on fait respecter les règles.",b:14},
   {t:"Le laisser faire, c'est la star de la soirée",s:-6,r:-6,f:"Violences d'un garde du corps tolérées.",law:"Un agent de protection rapprochée ne peut pas user de la force contre des tiers hors légitime défense.",b:2}],
  fail:{s:-6,r:-6,txt:"Un client blessé porte plainte contre l'établissement et le garde du corps."}},
 agentmalaise:{t:"Un de tes agents fait un malaise",zones:["piste","porte"],dl:18,q:"sst",desc:"Après des heures debout dans la chaleur sans boire, un de tes agents s'effondre près de la piste.",
  o:[{t:"Le mettre au frais, l'allonger, lui faire boire de l'eau s'il est conscient, appeler le 15 si besoin, le remplacer et revoir les pauses de l'équipe",s:7,r:2,g:"Prendre soin de l'équipe fait partie du rôle de chef : pauses, eau, rotation.",b:16,q:1},
   {t:"Lui dire de se reprendre et de retourner à son poste",s:-8,f:"Agent en malaise renvoyé à son poste.",law:"L'employeur a une obligation de sécurité envers ses salariés (Code du travail).",b:4}],
  fail:{s:-8,r:-3,txt:"Ton agent s'est cogné la tête en tombant : arrêt de travail."}},
 vestvol:{t:"Vol au vestiaire",zones:["vestiaire"],dl:22,desc:"Une cliente rend son ticket : son manteau a déjà été récupéré par quelqu'un d'autre avec un faux ticket.",
  o:[{t:"Regarder les caméras du vestiaire, noter la description, prévenir le 17, faire remplir une déclaration à l'établissement",s:5,r:4,g:"Traçabilité et alerte : la cliente sera indemnisée plus facilement.",b:14},
   {t:"Lui dire que le vestiaire n'est pas responsable",r:-6,txt:"Le vestiaire payant engage la responsabilité de l'établissement. La cliente l'apprend et porte plainte.",b:2}],
  fail:{r:-6,txt:"Trois autres manteaux disparaissent de la même façon."}},
 riviere:{t:"Chute dans la rivière",zones:["fumoir","secours"],dl:16,q:"sst",desc:"Un client ivre a glissé de la berge et se débat dans la rivière, le courant l'entraîne.",
  o:[{t:"Lancer la bouée du ponton, appeler le 18 / 112, lui parler pour qu'il s'accroche, ne pas plonger seul, l'aider à sortir puis le réchauffer",s:10,r:5,g:"Bouée, alerte, guidage : le sauvetage sans se mettre en danger.",b:20,q:1},
   {t:"Plonger tout de suite pour le chercher",s:-10,f:"Plongeon de nuit dans le courant.",law:"Risque de noyade pour le sauveteur : on lance d'abord une aide flottante et on alerte.",b:22}],
  fail:{s:-22,r:-12,txt:"Repêché plus loin par les pompiers, en hypothermie sévère."}},
 barbecue:{t:"Brûlure au barbecue",zones:["vestiaire"],dl:20,q:"sst",desc:"Un client a voulu raviver le barbecue avec de l'alcool : retour de flamme, il est brûlé au bras et au visage.",
  o:[{t:"Refroidir la brûlure à l'eau tempérée pendant au moins 10 minutes, retirer bijoux et montre, appeler le 15, faire éteindre le barbecue",s:9,r:4,g:"Eau, retrait des bijoux, 15 : les bons gestes face à une brûlure grave.",b:18,q:1},
   {t:"Mettre du beurre ou de la glace sur la brûlure",s:-8,f:"Remède de grand-mère sur une brûlure grave.",law:"Ni corps gras ni glace : seulement de l'eau tempérée et le 15.",b:8}],
  fail:{s:-12,r:-6,txt:"La brûlure s'est aggravée : évacué au centre des grands brûlés."}},
 badtrip:{t:"Bad trip",zones:["piste","fumoir"],dl:20,q:"sst",desc:"Une cliente terrifiée crie que « les murs bougent » et veut s'enfuir. Elle a pris un produit inconnu.",
  o:[{t:"L'emmener dans un endroit calme et peu éclairé avec une amie, lui parler doucement, appeler le 15 si elle va plus mal ou si elle devient dangereuse pour elle-même",s:8,r:4,g:"Environnement calme, présence rassurante, vigilance médicale : bonne réduction des risques.",b:18,q:1},
   {t:"La mettre dehors pour qu'elle se calme",s:-12,f:"Personne sous l'effet d'un produit laissée seule dehors.",law:"Risque d'accident (route, chute) : non-assistance à personne en danger (art. 223-6 Code pénal).",b:4}],
  fail:{s:-12,r:-6,txt:"Elle s'est enfuie dans la rue et a été percutée par une voiture."}},
 chillout:{t:"Zone de repos saturée",zones:["vip"],dl:24,desc:"La salle de repos est pleine de gens allongés. Deux ne réagissent presque plus et personne ne surveille.",
  o:[{t:"Vérifier chaque personne allongée (réponse, respiration), faire appeler le 15 pour les deux qui ne réagissent pas, mettre un agent en surveillance permanente",s:9,r:4,g:"Une zone de repos sans surveillance, c'est là que les overdoses passent inaperçues.",b:18},
   {t:"Laisser dormir tout le monde",s:-14,f:"Personnes inconscientes non surveillées.",law:"Non-assistance à personne en danger (art. 223-6 Code pénal).",b:2}],
  fail:{s:-18,r:-10,txt:"Une overdose découverte trop tard : réanimation."}},
 lacrymo:{t:"Gaz lacrymogène dans la foule",zones:["piste","bar"],dl:16,desc:"Un client vide une bombe lacrymogène au milieu de la piste. Tout le monde tousse, pleure et se rue vers la sortie.",
  o:[{t:"Faire couper la musique, ouvrir les issues et ventiler, guider l'évacuation de la zone sans bousculade, rincer les yeux à l'eau, appeler le 15 et le 17, repérer l'auteur",s:10,r:3,g:"Ventiler, évacuer dans le calme, soigner, alerter : la panique est évitée.",b:20},
   {t:"Fermer les portes pour attraper l'auteur",s:-16,f:"Public enfermé dans une zone gazée.",law:"Bloquer les sorties pendant une panique peut provoquer un écrasement mortel.",b:10},
   {t:"Poursuivre l'auteur dans la foule",s:-8,txt:"Pendant ce temps, une bousculade se produit dans l'escalier.",b:12}],
  fail:{s:-18,r:-10,txt:"Mouvement de panique : plusieurs blessés piétinés dans l'escalier."}},
 braquage:{t:"Braquage de la caisse",zones:["vestiaire","porte"],dl:14,desc:"Deux hommes cagoulés, dont un armé d'un pistolet, menacent la caissière et exigent la recette.",
  o:[{t:"Ne pas intervenir, éloigner les clients, ne faire aucun geste brusque, observer (signalements, véhicule), appeler le 17 dès qu'ils partent",s:8,r:3,g:"Face à une arme à feu, la seule priorité, ce sont les vies humaines. Observer et alerter.",b:16},
   {t:"Se jeter sur celui qui a le pistolet",s:-18,f:"Agent qui s'attaque à un braqueur armé.",law:"Mise en danger mortelle de soi et des autres : on ne résiste pas à une arme à feu."},
   {t:"Les poursuivre jusqu'à leur voiture",s:-10,f:"Poursuite de braqueurs armés.",law:"Risque de tirs : on relève la plaque et on appelle le 17."}],
  fail:{s:-12,r:-6,txt:"Les braqueurs repartent avec la recette ; la caissière est en état de choc, personne n'a pu donner de signalement."}},
 fauteuilevac:{t:"Évacuer une personne en fauteuil",zones:["vip","toilettes"],dl:22,q:"ssiap",desc:"Une alarme impose l'évacuation de l'étage. Un client en fauteuil roulant est au carré, en haut d'un escalier.",
  o:[{t:"L'accompagner vers l'espace d'attente sécurisé de l'étage, rester avec lui et signaler sa position aux pompiers",s:9,r:5,g:"C'est le principe des espaces d'attente sécurisés en ERP : on n'improvise pas un portage dangereux.",b:16,q:1},
   {t:"Le porter à quatre dans l'escalier avec son fauteuil",s:-6,txt:"Le fauteuil glisse, le client tombe de deux marches.",b:14},
   {t:"Évacuer les autres d'abord, on reviendra le chercher",s:-12,r:-8,f:"Personne à mobilité réduite laissée seule pendant une évacuation.",law:"L'évacuation des personnes handicapées doit être prévue et organisée (règlement de sécurité ERP).",b:6}],
  fail:{s:-12,r:-8,txt:"Les pompiers l'ont trouvé seul en haut de l'escalier, en panique."}},
 enfant:{t:"Un enfant perdu",zones:["piste","vestiaire"],dl:22,desc:"Un petit garçon de 6 ans pleure seul près du barbecue : il a perdu ses parents.",
  o:[{t:"Le garder avec un agent dans un endroit visible, faire une annonce au micro, ne jamais le confier à un inconnu sans vérifier, appeler le 17 si personne ne vient",s:7,r:6,g:"Enfant en sécurité, parents retrouvés grâce à l'annonce. Et on vérifie bien qui vient le chercher.",b:14},
   {t:"Le confier au premier adulte qui dit le connaître",s:-14,f:"Enfant confié sans vérification.",law:"On vérifie l'identité et le lien (l'enfant reconnaît-il l'adulte ?) avant de remettre un enfant."}],
  fail:{s:-10,r:-8,txt:"L'enfant s'est éloigné vers la berge. Les parents affolés appellent la police."}},
 agente:{t:"Ton agente harcelée",zones:["bar","piste"],dl:20,desc:"Un groupe d'hommes ivres tourne autour d'une de tes agentes : remarques sexistes, mains baladeuses, ils refusent de s'arrêter.",
  o:[{t:"Envoyer du renfort, faire sortir le groupe, proposer à ton agente de porter plainte et le noter dans la main courante",s:7,r:4,g:"Une agente aussi a droit à la protection de son équipe et de son employeur.",b:14},
   {t:"Lui dire que ça fait partie du métier",s:-6,r:-4,f:"Harcèlement d'une salariée minimisé.",law:"Outrage sexiste et agression sexuelle (art. 222-22 Code pénal) ; obligation de sécurité de l'employeur."}],
  fail:{s:-6,r:-6,txt:"Ton agente a craqué et quitté son poste en larmes."}},
 petards:{t:"Pétards dans la salle",zones:["piste","vip"],dl:16,q:"ssiap",desc:"À minuit, des clients allument des pétards et une fusée de détresse dans la salle bondée.",
  o:[{t:"Faire éteindre et confisquer les artifices non allumés (déposés volontairement au vestiaire), contrôler le départ de feu, exclure les auteurs",s:9,r:2,g:"Pyrotechnie interdite en ERP : on neutralise et on surveille le risque d'incendie.",b:14,q:1},
   {t:"Laisser faire, c'est le Nouvel An",s:-14,f:"Artifices tolérés dans une salle pleine.",law:"Règlement de sécurité ERP : pyrotechnie interdite sans autorisation ; risque d'incendie et de blessures."}],
  fail:{s:-18,r:-8,txt:"Une fusée a mis le feu à une banquette. Évacuation."}},
 tete:{t:"Choc à la tête",zones:["piste","bar","porte"],dl:18,q:"sst",desc:"Après une bousculade, un client est tombé en arrière et s'est cogné la tête. Il s'est relevé mais vomit et ne sait plus quel jour on est.",
  o:[{t:"L'allonger au calme, ne pas le laisser repartir, surveiller sa conscience, appeler le 15 (signes de traumatisme crânien)",s:9,r:4,g:"Vomissements et confusion après un choc : traumatisme crânien possible, le 15 est indispensable.",b:18,q:1},
   {t:"Lui donner de l'eau et le laisser rentrer chez lui puisqu'il marche",s:-14,f:"Traumatisé crânien laissé repartir seul.",law:"Un hématome peut s'aggraver en quelques heures : non-assistance à personne en danger (art. 223-6 Code pénal).",b:4}],
  fail:{s:-16,r:-8,txt:"Retrouvé inconscient dans le vestiaire : hémorragie cérébrale, opéré en urgence."}},
 proto:{t:"Ballons de protoxyde d'azote",zones:["fumoir","toilettes"],dl:22,desc:"Au fumoir, des clients inhalent des ballons de protoxyde d'azote avec des cartouches. L'un d'eux titube et ne sent plus ses jambes.",
  o:[{t:"Faire arrêter, demander de déposer les cartouches ou de quitter l'établissement, mettre celui qui va mal au calme et appeler le 15 si les symptômes persistent",s:7,r:3,g:"Le proto peut causer des lésions neurologiques graves : on fait cesser et on surveille.",b:14},
   {t:"Leur prendre les cartouches de force",s:-3,r:-4,f:"Saisie de force.",law:"On ne confisque pas de force : on demande de déposer ou de sortir (règlement intérieur)."},
   {t:"Laisser, c'est légal",s:-8,txt:"Celui qui titubait chute et se blesse ; d'autres s'y mettent toute la nuit.",b:2}],
  fail:{s:-8,r:-4,txt:"Deux clients évacués pour malaise avec troubles neurologiques."}},
 insulteraciste:{t:"Insultes racistes",zones:["piste","bar"],dl:20,desc:"Un client lance des insultes racistes à un autre client et à son amie, devant tout le monde.",
  o:[{t:"Faire cesser, exclure l'auteur, soutenir les victimes, leur proposer de porter plainte et garder les témoignages",s:6,r:7,g:"Injure raciste : délit. On protège les victimes et on écarte l'auteur.",b:14},
   {t:"Demander aux deux de se calmer et de s'éloigner",r:-8,f:"Victimes traitées comme l'auteur.",law:"Injure publique à caractère raciste (loi du 29 juillet 1881) : les victimes doivent être protégées."},
   {t:"Ne rien faire, ce ne sont que des mots",r:-10,txt:"La scène est filmée et fait le tour des réseaux : « la boîte qui laisse faire ».",b:2}],
  fail:{s:-6,r:-10,txt:"La situation a dégénéré en bagarre, et l'établissement est pointé du doigt."}},
 provocation:{t:"Provocation filmée",zones:["piste","porte"],dl:20,desc:"Un groupe filme un de tes agents en l'insultant, en lui soufflant dessus, pour le faire réagir et poster la vidéo.",
  o:[{t:"Faire relever l'agent par un collègue, rester impassible, exclure calmement le groupe, ne jamais toucher aux téléphones",s:6,r:5,g:"Le calme est la meilleure réponse : la vidéo ne montrera rien.",b:12},
   {t:"Laisser ton agent « leur donner une leçon »",s:-8,r:-12,f:"Agent qui répond à une provocation par la violence.",law:"La vidéo coupée au montage fera le tour des réseaux ; violences volontaires (art. 222-11 Code pénal) et carte professionnelle en jeu."}],
  fail:{r:-8,txt:"Ton agent a craqué et a poussé un des provocateurs : la vidéo est partout."}},
 asthme:{t:"Crise d'asthme",zones:["piste","fumoir"],dl:16,q:"sst",desc:"Une cliente siffle en respirant et n'arrive plus à parler. Elle montre son sac : son inhalateur est au vestiaire.",
  o:[{t:"L'asseoir penchée en avant à l'air frais, faire récupérer son inhalateur au vestiaire, l'aider à le prendre, appeler le 15 si ça ne passe pas",s:9,r:4,g:"Position assise, son traitement, le 15 si ça persiste : gestes justes.",b:16,q:1},
   {t:"L'allonger sur le dos sur une banquette",s:-8,f:"Personne en crise d'asthme allongée.",law:"Une personne qui manque d'air reste assise, penchée en avant : allongée, elle respire encore plus mal.",b:8}],
  fail:{s:-14,r:-6,txt:"Crise d'asthme sévère : évacuée par le SAMU."}},
 streaker:{t:"Un client nu sur la piste",zones:["piste"],dl:22,desc:"Pour un pari, un client s'est déshabillé entièrement et court sur la piste sous les applaudissements.",
  o:[{t:"Le couvrir avec une veste, le raccompagner calmement au vestiaire pour qu'il se rhabille, puis l'exclure",r:4,g:"Calme et dignité : on couvre, on raccompagne, on exclut. Pas besoin d'en faire un spectacle.",b:10},
   {t:"Le plaquer au sol devant tout le monde",s:-4,r:-6,f:"Usage de la force disproportionné.",law:"Il n'est pas violent : la force n'est pas nécessaire.",b:10},
   {t:"Laisser faire, ça amuse la salle",r:-6,txt:"Plusieurs clientes se plaignent ; la vidéo fait le tour des réseaux.",b:2}],
  fail:{r:-5,txt:"Il a fait trois tours de piste et grimpé sur le bar."}},
 cablesdj:{t:"Bière renversée sur la régie",zones:["piste"],dl:18,q:"ssiap",desc:"Un client a renversé une pinte sur la table de mixage et les multiprises. Des étincelles, une odeur de brûlé.",
  o:[{t:"Faire couper l'alimentation de la régie au disjoncteur, éloigner tout le monde, surveiller le départ de feu avec un extincteur adapté (CO2)",s:9,r:2,g:"Électricité + liquide : on coupe à la source, on ne touche rien, extincteur CO2 prêt.",b:12,q:1},

 if(L.pet)s+=`<g transform="translate(96,200)"><rect x="-14" y="-6" width="28" height="22" rx="4" fill="#7d3c98"/><circle cx="0" cy="-10" r="8" fill="#f5f5f5"/><ellipse cx="-6" cy="-15" rx="3" ry="5" fill="#ddd"/><ellipse cx="6" cy="-15" rx="3" ry="5" fill="#ddd"/><circle cx="-3" cy="-10" r="1.2" fill="#111"/><circle cx="3" cy="-10" r="1.2" fill="#111"/></g>`;
 s+=`<path d="M22,165 Q150,212 278,165" stroke="#9b1239" stroke-width="6" fill="none"/><rect x="18" y="150" width="8" height="70" fill="#d4ac0d"/><rect x="274" y="150" width="8" height="70" fill="#d4ac0d"/><circle cx="22" cy="150" r="7" fill="#f1c40f"/><circle cx="278" cy="150" r="7" fill="#f1c40f"/>`;

function idPhotoSvg(c){if(!c.lk)c.lk=makeLook(c);const P=c.lk.photo||c.lk;const Q={...P,iv:0,att:"calme",cap:false,tiara:false,feats:P===c.lk?{...P.feats,sun:0}:{}};
 return `<svg viewBox="-36 -40 72 82" style="width:62px;height:72px;float:left;margin:0 10px 4px 0;background:#cfd8e3;border-radius:4px">${headSvg(Q)}</svg>`}

// ================= musique d'ambiance (Web Audio, générée en direct) =================
const AU={ctx:null,on:true,mode:"menu",next:0,step:0,timer:null};
try{if(localStorage.getItem("secu_nuit_mute")==="1")AU.on=false}catch(e){}
const PROG={guinguette:[[55,59,62],[50,54,57],[55,59,62],[48,52,55]],bunker:[[45,48,52],[45,48,52],[44,48,51],[43,46,50]],velvet:[[50,53,57],[55,59,62],[48,52,55],[53,57,60]],casino:[[45,48,52],[50,53,57],[52,56,59],[45,48,52]],hangar:[[40,43,47],[40,43,47],[43,47,50],[38,42,45]],neon:[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],comptoir:[[52,56,59],[57,61,64],[59,63,66],[57,61,64]],odyssee:[[50,53,57],[46,50,53],[48,52,55],[45,48,52]],sunset:[[55,59,62],[52,55,59],[48,52,55],[50,54,57]]};
const mtof=m=>440*Math.pow(2,(m-69)/12);
function auStart(){
 if(AU.ctx||!AU.on)return;
 try{const ctx=new(window.AudioContext||window.webkitAudioContext)();AU.ctx=ctx;
  AU.master=ctx.createGain();AU.master.gain.value=.32;
  AU.filter=ctx.createBiquadFilter();AU.filter.type="lowpass";AU.filter.frequency.value=1200;AU.filter.Q.value=.7;
  AU.filter.connect(AU.master);AU.master.connect(ctx.destination);
  const len=ctx.sampleRate*.4,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.noise=buf;
  AU.next=ctx.currentTime+.1;AU.timer=setInterval(auTick,25);auMode(AU.mode);
 }catch(e){AU.ctx=null}
 updMute();
}
function auTick(){const ctx=AU.ctx;if(!ctx)return;const st=60/VEN().tempo/4;while(AU.next<ctx.currentTime+.15){auStep(AU.step,AU.next);AU.next+=st;AU.step++}}
function env(g,t,a,peak,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec)}
function kick(t){const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.13);env(g,t,.003,.9,.32);o.connect(g);g.connect(AU.filter);o.start(t);o.stop(t+.4)}
function noiseHit(t,type,f,vol,dec){const c=AU.ctx,n=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();n.buffer=AU.noise;fl.type=type;fl.frequency.value=f;env(g,t,.002,vol,dec);n.connect(fl);fl.connect(g);g.connect(AU.filter);n.start(t);n.stop(t+dec+.05)}
function tone(f,t,type,vol,a,dec){const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;env(g,t,a,vol,dec);o.connect(g);g.connect(AU.filter);o.start(t);o.stop(t+a+dec+.05)}
function auStep(s,t){
 const ven=VEN(),b=s%16,bar=Math.floor(s/16)%4,ch=(PROG[C?C.venue:"neon"]||PROG.neon)[bar],m=AU.mode,st=ven.style;
 if(b===0)ch.forEach(n=>tone(mtof(n),t,"triangle",m==="menu"?.05:.035,.25,60/ven.tempo*3.6));
 if(m==="menu"){if(b%4===0)tone(mtof(ch[(b/4)%3]+12),t,"sine",.05,.01,.5);return}
 if(st==="rock"){if(b===0||b===8||b===10)kick(t);if(b===4||b===12)noiseHit(t,"bandpass",1800,.35,.14);if(b%2===0)noiseHit(t,"highpass",8000,.08,.04);if(b%2===0)tone(mtof(ch[0]-12),t,"sawtooth",.12,.005,.18)}
 else{if(b%4===0)kick(t);if(b%4===2)noiseHit(t,"highpass",7500,.12,.05);if(b===4||b===12)noiseHit(t,"bandpass",1500,.22,.12);
  if(b%4===2)tone(mtof(ch[0]-12),t,st==="house"?"square":"sawtooth",.13,.005,.16);
  if(st==="house"&&(b===3||b===11))tone(mtof(ch[1]+12),t,"triangle",.05,.005,.2);
  if(C&&C.venue==="odyssee"&&b%2===1)tone(mtof(ch[b%3]+12),t,"square",.025,.002,.07)}
}
function auMode(m){AU.mode=m;if(!AU.ctx)return;const f={menu:1600,door:420,inside:7000,exit:350}[m]||1600;AU.filter.frequency.setTargetAtTime(f,AU.ctx.currentTime,.5)}
function sfxTone(fs,type,vol){if(!AU.ctx||!AU.on)return;const c=AU.ctx,t=c.currentTime;fs.forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.value=f;env(g,t+d,.005,vol||.07,.16);o.connect(g);g.connect(c.destination);o.start(t+d);o.stop(t+d+.2)})}
function sfxOk(){sfxTone([[660,0],[990,.09]],"sine",.08)}
function sfxNo(){sfxTone([[220,0],[180,.12]],"sawtooth",.05)}
function sfxAlert(){if(!AU.ctx||!AU.on)return;const c=AU.ctx,t=c.currentTime;[[988,0],[740,.13]].forEach(([f,d])=>{const o=c.createOscillator(),g=c.createGain();o.type="square";o.frequency.value=f;env(g,t+d,.005,.08,.11);o.connect(g);g.connect(c.destination);o.start(t+d);o.stop(t+d+.15)})}
function auToggle(){AU.on=!AU.on;try{localStorage.setItem("secu_nuit_mute",AU.on?"0":"1")}catch(e){}
 if(AU.on){if(!AU.ctx)auStart();else{AU.ctx.resume();AU.master.gain.setTargetAtTime(.32,AU.ctx.currentTime,.1)}}else if(AU.ctx)AU.master.gain.setTargetAtTime(0,AU.ctx.currentTime,.1);updMute()}
function updMute(){const b=document.getElementById("mute");if(b)b.textContent=AU.on?"🔊":"🔇"}
document.addEventListener("pointerdown",e=>{if(e.target&&e.target.id==="mute")return;auStart()},{once:true});
const _render=render;
render=function(){_render();const ph=PH==="menu"||!S?"menu":S.phase;auMode(ph==="door"?"door":ph==="inside"?"inside":ph==="exit"||ph==="end"||ph==="final"?"exit":"menu")};
render();
</script>
