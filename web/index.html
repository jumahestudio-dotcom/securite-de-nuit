   {t:"Accepter aussi une simple photo de carte envoyée par un ami",s:-6,f:"Photo de pièce d'identité acceptée.",law:"Une photo ne prouve ni l'identité ni l'âge : c'est la porte ouverte aux mineurs."}]},
 motaide:{t:"Un mot glissé discrètement",d:"En te tendant sa pièce, une jeune femme glisse un papier plié : « Aidez-moi. » L'homme qui l'accompagne tient son passeport et répond à sa place.",note:"les associations de lutte contre la traite des êtres humains forment les professionnels de la nuit à repérer ces signaux : une personne qui ne parle pas pour elle, sans ses papiers, sous contrôle.",
  o:[{t:"Rester naturel, séparer discrètement la jeune femme sous un prétexte (contrôle, vestiaire), la mettre à l'abri et appeler le 17",s:10,r:6,g:"Tu as peut-être sauvé quelqu'un : discrétion, mise à l'abri, alerte."},
   {t:"Lire le mot à voix haute et demander à l'homme de s'expliquer",s:-12,f:"Victime exposée devant celui qui la contrôle.",law:"Il ne faut jamais mettre la victime en danger : on agit discrètement et on alerte la police."},
   {t:"Les faire entrer, ce n'est pas tes affaires",s:-14,f:"Appel à l'aide ignoré.",law:"Non-assistance à personne en danger (art. 223-6 Code pénal)."}]},
 voisinferme:{t:"Le club voisin est fermé",d:"La préfecture vient de fermer le club d'à côté pour un mois après des bagarres. Ses clients arrivent en masse chez vous, certains déjà énervés.",note:"les fermetures administratives de discothèques sont régulières en France après des violences ou des trafics, souvent pour plusieurs semaines.",
  o:[{t:"Garder la même rigueur : jauge, contrôle individuel, refus des plus agités. Prévenir l'équipe de salle",s:7,r:3,g:"La rigueur évite de récupérer les problèmes du voisin… et sa fermeture."},
   {t:"Ouvrir grand, c'est une aubaine",s:-10,f:"Contrôles relâchés face à un afflux de clients à risque.",law:"Un établissement qui laisse entrer n'importe qui s'expose lui aussi à une fermeture administrative (art. L3332-15 CSP)."}]},
 bebe:{t:"La poussette",d:"Une jeune mère arrive avec un bébé en poussette, furieuse : « Mon mari est là-dedans, il devait garder le petit ! Je veux entrer le chercher ! »",
  o:[{t:"Ne pas faire entrer le bébé, prendre le nom du mari, envoyer un agent le chercher et le faire sortir",r:5,g:"Un bébé n'a rien à faire dans le bruit et l'alcool : on règle la situation à l'entrée."},
   {t:"La laisser entrer avec la poussette",s:-6,r:-3,f:"Nourrisson admis dans une discothèque.",law:"Bruit, fumée, alcool, foule : danger pour un nourrisson et pour la sécurité de l'évacuation."}]},
 foyer:{t:"La sortie du foyer",d:"Un éducateur arrive avec cinq adultes en situation de handicap mental, d'un foyer voisin. Ils sont ravis de venir danser.",
  o:[{t:"Les accueillir normalement, contrôle habituel, éventuellement leur indiquer un coin plus calme",r:6,g:"Accueil comme tout le monde : refuser serait une discrimination liée au handicap."},
   {t:"Refuser : « ça risque de mettre mal à l'aise les autres clients »",r:-18,f:"Refus d'un groupe en raison du handicap.",law:"Discrimination liée au handicap (art. 225-1 et 225-2 Code pénal)."}]},
 montre:{t:"Une montre « pas chère »",d:"Un client dans la file te propose discrètement une montre de luxe à 100 € : « Elle est neuve, je te fais un prix. »",
  o:[{t:"Refuser, noter sa description et le signaler à la police (la montre est probablement volée)",s:3,r:3,g:"Acheter un objet volé, c'est du recel. Bon réflexe de signaler."},
   {t:"L'acheter, c'est une affaire",r:-8,f:"Achat d'un objet probablement volé.",law:"Recel (art. 321-1 Code pénal) : jusqu'à 5 ans d'emprisonnement."}]},
 touriste:{t:"Le touriste perdu",d:"Un touriste japonais, un peu perdu, te montre l'adresse de son hôtel sur son téléphone. Il ne parle ni français ni anglais.",
  o:[{t:"Lui montrer le chemin sur une carte, lui appeler un taxi si c'est loin, avec le sourire",r:4,g:"L'accueil, c'est aussi ça : l'image de l'établissement et de la ville."},
   {t:"Lui faire signe de partir, tu as du travail",r:-2,txt:"Il erre dans le quartier pendant une heure."}]},
 ordonnance:{t:"L'ex de Nadia est là",d:"L'ex-compagnon de Nadia arrive, très tendu : « Je sais qu'elle est là, je veux la voir. » Nadia t'a dit qu'une ordonnance de protection lui interdit de l'approcher.",
  o:[{t:"Refuser l'entrée calmement, le garder à distance, prévenir l'équipe de salle pour protéger Nadia, appeler le 17 : il viole peut-être une ordonnance",s:9,r:6,g:"Ne pas respecter une ordonnance de protection est un délit : la police intervient vite. Nadia est en sécurité."},
   {t:"Le laisser entrer, l'ordonnance c'est leur affaire",s:-14,r:-8,f:"Auteur présumé de violences conjugales admis malgré une ordonnance de protection.",law:"Violation d'une ordonnance de protection : délit (art. 227-4-2 Code pénal). La victime était en danger."},
   {t:"Lui dire qu'elle est au bar, pour éviter un scandale à la porte",s:-16,r:-10,f:"Information donnée à l'auteur sur la présence de la victime.",law:"La victime a fait confiance à l'équipe : on ne révèle jamais où elle se trouve."}]},
 mission:{t:"Policiers en mission",d:"Deux personnes en civil te montrent discrètement leur carte de police : « On est en mission, on doit entrer sans se faire remarquer. »",
  o:[{t:"Vérifier rapidement la carte, les laisser entrer discrètement, prévenir le gérant sans alerter la salle",s:4,r:3,g:"En mission, les policiers peuvent entrer dans un lieu ouvert au public. Discrétion et coopération."},
   {t:"Leur faire payer l'entrée et les faire passer par la palpation",r:-4,txt:"Tu as failli faire échouer leur surveillance devant tout le monde.",sat:-2},
   {t:"Annoncer au micro que la police est là",s:-10,r:-6,f:"Opération de police compromise.",law:"Révéler une opération de police en cours peut constituer une entrave à la justice."}]},
 mariage:{t:"Le mariage arrive",d:"Une noce de 30 personnes arrive après le repas, en costumes et robes de soirée. Certains sont très ivres, d'autres sobres, dont les mariés.",
  o:[{t:"Contrôler chaque invité individuellement : faire entrer les sobres et les mariés, refuser poliment les quelques invités trop ivres",s:6,r:5,g:"Contrôle au cas par cas, même dans un groupe festif : la noce continue sans les plus alcoolisés."},
   {t:"Tout le monde entre, c'est un mariage !",s:-8,f:"Invités manifestement ivres admis en groupe.",law:"Interdit de servir une personne manifestement ivre (Code de la santé publique)."},
   {t:"Refuser toute la noce, trop de monde ivre",r:-6,txt:"La mariée pleure devant la porte, les sobres partent furieux.",sat:-3}]},
 beaufrere:{t:"« Je suis le beau-frère du patron »",d:"Un homme passe devant toute la file : « Je suis le beau-frère du patron, appelle-le si tu veux. » Il sent fort l'alcool.",
  o:[{t:"L'inviter à patienter, appeler le gérant pour vérifier, et le contrôler comme tout le monde (dont son état d'ivresse)",r:3,g:"Vérifier et contrôler : la parenté ne dispense pas du contrôle d'ivresse."},
   {t:"Le faire entrer tout de suite",s:-4,r:-2,txt:"Le gérant n'a pas de beau-frère. Il finit ivre mort au bar."}]},
 rampe:{t:"L'accès en fauteuil",d:"Une cliente en fauteuil roulant arrive : l'entrée a trois marches. « Il y a un accès ? »",
  o:[{t:"Installer la rampe amovible prévue, l'aider si elle le souhaite, puis contrôle normal",r:6,g:"Accessibilité des ERP : on met en place l'accès prévu, avec respect."},
   {t:"S'excuser : « Ce n'est pas accessible, désolé »",r:-12,f:"Accès refusé à une personne en fauteuil.",law:"Les ERP doivent être accessibles aux personnes handicapées (loi du 11 février 2005) ; refuser l'accès peut constituer une discrimination."}]},
 arriveivre:{t:"Il arrive au volant",d:"Une voiture se gare en travers devant l'entrée. Le conducteur sort en titubant, les yeux rouges, et veut entrer.",
  o:[{t:"Refuser l'entrée (ivresse manifeste), lui proposer d'appeler un taxi, et prévenir le 17 s'il reprend le volant",s:7,r:3,g:"Refus fondé et prévention : il ne reprendra pas la route ivre sans que la police soit prévenue."},
   {t:"Le faire entrer, il ne conduit plus pour l'instant",s:-6,f:"Personne manifestement ivre admise.",law:"Interdit de servir une personne manifestement ivre (Code de la santé publique), et il repartira en voiture."}]},
 mineursdehors:{t:"Des ados boivent devant l'entrée",d:"Une bande d'adolescents de 15 ans boit de la vodka sur le trottoir, juste à côté de la file. L'une d'elles a l'air très mal.",
  o:[{t:"S'assurer que la jeune fille va bien (15 si besoin), leur demander de s'éloigner et prévenir le 17 pour des mineurs alcoolisés",s:6,r:4,g:"Des mineurs en danger devant ta porte : on vérifie, on alerte."},
   {t:"Ce n'est pas devant chez nous, on ignore",s:-6,r:-4,txt:"La jeune fille fait un coma éthylique sur le trottoir 20 minutes plus tard."}]},
 voisin:{t:"Le voisin en pyjama",d:"Un voisin furieux, en pyjama, arrive à la porte : la musique l'empêche de dormir et il menace d'appeler la mairie.",
  o:[{t:"L'écouter, s'excuser, faire baisser les basses par le DJ et fermer les fenêtres, lui laisser le numéro du gérant",r:5,g:"Les bonnes relations avec le voisinage évitent les fermetures administratives pour bruit."},
   {t:"Lui dire d'acheter des bouchons d'oreilles",r:-6,sat:-4,txt:"Il porte plainte : contrôle du bruit la semaine suivante."}]},
 exconjoint:{t:"L'ex qui cherche quelqu'un",d:"Un homme très tendu veut entrer : « Mon ex est à l'intérieur avec un autre, je veux juste lui parler. » Il serre les poings.",
  o:[{t:"Refuser l'entrée calmement, prévenir discrètement l'équipe de salle pour qu'elle protège la femme et lui propose de partir en sécurité, appeler le 17 s'il reste",s:8,r:5,g:"Risque de violence conjugale : on ne le laisse pas entrer, on protège la personne visée."},
   {t:"Le laisser entrer, il veut juste parler",s:-12,r:-6,f:"Homme menaçant admis pour retrouver son ex-compagne.",law:"Les violences conjugales commencent souvent par ce genre de « discussion ». Le refus pour comportement menaçant est légitime."}]},
 fauxvip:{t:"« Je suis sur la liste »",d:"Une femme très sûre d'elle affirme être sur la liste VIP, invitée « par Max, l'associé du patron ». Son nom n'y est pas.",
  o:[{t:"Rester poli, vérifier auprès du gérant par téléphone, et la faire passer par l'entrée normale en attendant",r:4,g:"On vérifie au lieu de céder au bluff : la liste, c'est la liste."},
   {t:"La faire passer en VIP, elle a l'air de connaître du monde",r:-3,sat:-3,txt:"Personne ne la connaît. Elle commande une bouteille à 300 € qu'elle ne paie pas."}]},
 erasmus:{t:"Le groupe Erasmus",d:"Vingt étudiants de toutes nationalités arrivent ensemble, joyeux, avec des pièces d'identité de six pays différents.",
  o:[{t:"Les contrôler un par un comme tout le monde : âge, état, tenue, et faire entrer ceux qui sont en règle",s:3,r:5,g:"Contrôle individuel, mêmes règles pour tous, quelle que soit la nationalité."},
   {t:"Refuser le groupe : « trop d'étrangers d'un coup »",r:-18,f:"Refus d'un groupe en raison de la nationalité.",law:"Discrimination fondée sur l'origine ou la nationalité (art. 225-1 et 225-2 Code pénal)."},
   {t:"Les faire tous entrer sans contrôle, ils sont sympas",s:-8,f:"Vingt personnes admises sans aucun contrôle.",law:"Le contrôle d'accès est individuel : âge, état, objets dangereux."}]},
 secoursrue:{t:"Malaise sur le trottoir",d:"Une passante s'effondre sur le trottoir d'en face. Personne ne s'arrête.",
  o:[{t:"Envoyer un agent formé : vérifier la conscience et la respiration, appeler le 15, PLS ou massage selon l'état, pendant qu'un autre garde la porte",s:8,r:6,g:"Porter secours tout en gardant la porte : bonne organisation."},
   {t:"Ne pas quitter la porte, quelqu'un va s'en occuper",s:-10,r:-6,f:"Aucun secours porté à une personne effondrée en face.",law:"Non-assistance à personne en danger (art. 223-6 Code pénal) : il suffit au moins d'alerter le 15."}]},
 amie:{t:"« Mon amie ne répond plus »",d:"Une cliente sortie fumer ne peut plus rentrer (tampon effacé) et s'inquiète : son amie, très ivre, est restée seule à l'intérieur et ne répond plus au téléphone.",
  o:[{t:"Prendre la description de l'amie, envoyer un agent la chercher, la faire raccompagner ou prendre en charge si elle va mal",s:6,r:5,g:"Une cliente vulnérable seule à l'intérieur, c'est une priorité."},
   {t:"Lui dire que sans tampon, elle repaye ou elle reste dehors",r:-5,s:-4,txt:"Son amie a été retrouvée inconsciente aux toilettes une heure après.",f:"Signalement d'une personne vulnérable ignoré."}]},
 mere17:{t:"La mère et sa fille de 17 ans",d:"Une mère veut entrer avec sa fille qui fête ses 17 ans : « Elle est avec moi, je suis responsable, c'est son anniversaire ! »",
  o:[{t:"Expliquer gentiment que l'établissement est réservé aux majeurs, même accompagnés, et refuser",r:2,g:"La consigne (18 ans) vaut aussi pour les mineurs accompagnés, et l'alcool leur reste interdit."},
   {t:"Les laisser entrer, la mère surveille",s:-4,r:-3,f:"Mineure admise malgré la consigne.",law:"Même accompagnée, une mineure ne peut pas être servie en alcool (art. L3342-1 CSP), et la consigne de l'établissement est 18 ans."}]},
 livreur:{t:"Le livreur",d:"Un livreur à vélo arrive avec des burgers commandés par un client du carré VIP. Il veut entrer pour livrer en main propre.",
  o:[{t:"Faire appeler le client pour qu'il vienne récupérer sa commande à l'entrée",r:2,g:"Personne n'entre sans contrôle, même pour cinq minutes."},
   {t:"Le laisser entrer avec son gros sac sans contrôle",s:-4,f:"Entrée d'une personne et d'un sac non contrôlés.",law:"Le contrôle d'accès s'applique à toute personne qui entre."}]},
 radiation:{t:"Demande de retrait de la liste noire",d:"Un homme exclu il y a six mois revient poliment : il s'excuse pour la bagarre et demande à être retiré de la liste noire.",
  o:[{t:"L'écouter poliment et lui dire que seul le gérant peut lever une exclusion ; prendre ses coordonnées pour transmettre",r:4,g:"Le physio applique la liste, le gérant la décide : réponse correcte et respectueuse."},
   {t:"Le faire entrer, il a l'air d'avoir changé",s:-4,txt:"Le gérant le voit au bar et te convoque.",sat:-4,f:"Exclusion levée sans l'accord de l'exploitant."},
   {t:"Le chasser en l'insultant",r:-5,txt:"Il porte plainte pour injures, et il avait l'air sincère."}]},
 scooter:{t:"Vol de scooter devant l'entrée",d:"Sous tes yeux, deux jeunes forcent l'antivol d'un scooter garé devant la boîte.",
  o:[{t:"Appeler le 17 en donnant la description, faire signe aux clients du scooter, ne pas quitter ton poste pour une poursuite",s:5,r:3,g:"Alerter et décrire : c'est le plus utile. Ta mission est la porte."},
   {t:"Les poursuivre dans la rue",s:-6,txt:"Pendant ce temps, trois personnes entrent sans contrôle.",f:"Poste abandonné."},
   {t:"Ne rien faire, ce n'est pas ton scooter",r:-3,txt:"Un client se fait voler son scooter sous le nez de l'équipe."}]},
 inspection:{t:"Contrôle de l'inspection du travail",d:"Deux inspecteurs du travail se présentent : ils veulent voir les contrats, les déclarations d'embauche et les horaires des agents.",
  o:[{t:"Les accueillir, appeler le gérant, présenter les contrats, les déclarations d'embauche et le planning",r:4,g:"Coopération totale : un contrôle bien préparé se passe sans problème."},
   {t:"Leur dire de revenir lundi, ce n'est pas le moment",r:-10,sat:-6,f:"Refus de laisser entrer l'inspection du travail.",law:"Faire obstacle à un inspecteur du travail est un délit (art. L8114-1 Code du travail)."}]},
 urine:{t:"Client qui urine sur la façade",d:"Un client ivre refoulé urine contre la façade, devant la file et les voisins.",
  o:[{t:"Lui demander d'arrêter et de partir, sans le brusquer ; appeler le 17 s'il devient agressif",r:3,g:"Fermeté verbale : on règle la nuisance sans violence."},
   {t:"Le pousser violemment",s:-5,r:-4,f:"Violence sur un client ivre sur la voie publique.",law:"Pas de pouvoir de maintien de l'ordre sur la voie publique (art. L613-1 CSI)."}]},
 doublon:{t:"Billets en double",d:"Deux personnes présentent le même billet électronique : le code a déjà été scanné il y a 10 minutes.",
  o:[{t:"Mettre les deux de côté, vérifier l'achat avec la billetterie, faire payer ou refuser celui qui n'a pas acheté le billet",r:3,g:"Vérification auprès de la billetterie : on ne punit pas l'acheteur de bonne foi."},
   {t:"Refuser les deux, point",r:-5,txt:"L'acheteur de bonne foi, client régulier, est furieux et se fait rembourser."},
   {t:"Les faire entrer tous les deux",r:-2,sat:-2,txt:"Le gérant découvre 40 entrées frauduleuses à la fin de la soirée."}]},
 flic:{t:"« Police, on entre »",d:"Un homme montre une carte de police et veut entrer gratuitement avec cinq amis : « On est collègues, laisse passer. »",
  o:[{t:"Rester courtois : sans mission, la carte de police ne donne pas d'entrée gratuite. Contrôle normal, entrée payante, ou décision du gérant",r:3,g:"Courtoisie et même règle pour tous : impeccable."},
   {t:"Les laisser passer gratuitement sans contrôle",s:-5,f:"Groupe admis sans contrôle ni paiement.",law:"Hors mission, une carte de police ne dispense ni du contrôle d'accès ni du paiement."},
   {t:"Lui dire en riant que sa carte est sûrement fausse",r:-6,txt:"Il était vraiment policier… et il le prend très mal."}]},
 ambulance:{t:"L'ambulance est bloquée",d:"Une ambulance appelée pour un voisin ne peut pas passer : des voitures de clients sont garées en double file devant l'entrée.",
  o:[{t:"Envoyer un agent guider l'ambulance, faire annoncer au micro les plaques des voitures, faire dégager la file d'attente de la chaussée",s:6,r:5,g:"Faciliter l'accès des secours, c'est prioritaire sur tout le reste."},
   {t:"Ce n'est pas pour un client, ce n'est pas notre problème",s:-6,r:-6,f:"Aucune aide aux secours bloqués devant l'établissement.",law:"Gêner ou ne pas faciliter l'accès des secours peut engager la responsabilité de l'établissement."}]},
 controle:{t:"Contrôle à la porte",d:"Une patrouille de police accompagne un contrôleur du CNAPS. Ils demandent la carte professionnelle de chaque agent en service.",special:"controle"},
 revanche:{t:"Un client refusé revient",d:"Un homme refusé plus tôt revient avec trois amis. Ils se postent face à la porte : « Alors, on fait moins le malin ? »",
  o:[{t:"Rester derrière la porte, garder la distance, ne pas répondre aux provocations, appeler le 17",s:6,g:"Parfait : on ne sort pas pour se battre, on protège l'entrée et on alerte."},
   {t:"Sortir à trois pour leur faire comprendre",s:-10,r:-6,f:"Agents sortis pour en découdre sur la voie publique.",law:"Hors de l'établissement, les agents n'ont aucun pouvoir de maintien de l'ordre (art. L613-1 CSI). Une bagarre « préventive » n'est pas de la légitime défense."},
   {t:"Le laisser finalement entrer pour éviter les ennuis",s:-6,r:-3,txt:"Il entre avec ses amis… et l'ambiance se tend dans la salle.",f:"Céder à l'intimidation."}]}
};
const GER={
 jauge:{t:"📞 Le gérant : « Fais entrer mes potes »",d:"« La salle est pleine, je sais, mais j'ai 30 amis d'un associé dehors. Fais-les entrer, je prends la responsabilité. »",
  o:[{t:"Refuser poliment : la jauge est une obligation de sécurité, personne ne peut la dépasser, même le gérant",s:6,sat:-4,g:"Tu as eu raison : l'effectif maximal d'un ERP ne se négocie pas. En cas de drame, c'est aussi ta responsabilité."},
   {t:"Les faire entrer, c'est le patron",s:-12,f:"Jauge dépassée de 30 personnes sur ordre du gérant.",law:"Règlement de sécurité incendie des ERP : l'effectif maximal ne doit jamais être dépassé ; l'ordre du gérant ne te couvre pas.",act:"cap"}]},
 images:{t:"📞 Le gérant : « Efface la vidéo »",d:"« La bagarre de tout à l'heure, efface les images des caméras. Je ne veux pas d'histoires avec la police. »",
  o:[{t:"Refuser et conserver les images : elles pourront être demandées par la police",r:4,sat:-3,g:"Refus justifié : effacer des preuves est un délit, et ça se retournerait contre lui."},
   {t:"Effacer les images",r:-12,f:"Images de vidéoprotection effacées après un incident.",law:"Destruction de preuves utiles à une enquête : délit (art. 434-4 Code pénal)."}]},
 economie:{t:"📞 Le gérant : « Renvoie un agent »",d:"« C'est calme, renvoie un de tes agents chez lui maintenant, je ferai des économies. »",
  o:[{t:"Lui expliquer les risques (plus d'une heure de service, salle pleine) mais obéir si le gérant insiste",sat:2,g:"Tu as donné ton avis de professionnel, la décision lui appartient.",act:"agentOff"},
   {t:"Refuser : l'effectif de sécurité est prévu pour la jauge",sat:-5,s:3,txt:"Le gérant raccroche, agacé. Mais l'équipe reste complète."}]},
 copain:{t:"📞 Le gérant : « Le type au fumoir, c'est un pote »",d:"« Le gars qui fait des allers-retours au fumoir, laisse-le tranquille, c'est un ami à moi. » Tu sais qu'il vend de la drogue.",
  o:[{t:"Refuser de fermer les yeux sur le trafic, l'exclure et le noter dans la main courante",s:6,sat:-6,g:"Tu n'es pas complice d'un trafic, même sur ordre. C'est aussi ta carte professionnelle qui est en jeu."},
   {t:"Le laisser faire, c'est le patron",s:-10,f:"Trafic de stupéfiants toléré sur ordre du gérant.",law:"Complicité possible et fermeture administrative (art. L3332-15 CSP). L'agent risque sa carte professionnelle."}]},
 nièce:{t:"📞 Le gérant : « Laisse ma nièce »",d:"« Ma nièce de 16 ans est au bar avec ses copines, laisse-la, c'est la famille. »",
  o:[{t:"Refuser : arrêter le service d'alcool, la faire raccompagner, prévenir sa famille",s:4,sat:-4,g:"La loi est la même pour la famille du patron : pas de mineurs servis en alcool."},
   {t:"La laisser, c'est sa nièce",s:-6,f:"Mineure de 16 ans laissée dans l'établissement et servie en alcool.",law:"Art. L3342-1 Code de la santé publique : 7 500 € d'amende."}]},
 tard:{t:"📞 Le gérant : « On ferme à 6 h »",d:"« Ça marche fort ce soir, on ferme une heure plus tard que prévu. »",
  o:[{t:"Lui rappeler que l'heure de fermeture est fixée par arrêté, et préparer la fermeture à l'heure",sat:-3,r:2,g:"L'heure de fermeture autorisée s'impose. Ton rappel lui évite une sanction."},

function region(x,z){if(z>.4)return"out";if(z>-6.2)return"hall";if(x<GEO.tx&&z<GEO.tz)return"toi";if(x>GEO.fx&&z>GEO.fz0&&z<-6)return"fum";return"main"}
let UP={out:[[0,1],[0,-.8]],hall:[[0,-4.6],[0,-7.6]],toi:[[-11,-26.4],[-11,-23.6]],fum:[[10,-9.4],[8.2,-9.4]]};
const PARENT={out:"hall",hall:"main",toi:"main",fum:"main",main:null};
function route(a,b){const ra=region(a[0],a[2]),rb=region(b[0],b[2]);if(ra===rb)return[[b[0],b[2]]];
 const ca=[],cb=[];let r=ra;while(r){ca.push(r);r=PARENT[r]}r=rb;while(r){cb.push(r);r=PARENT[r]}
 const common=ca.find(x=>cb.includes(x));const pts=[];
 for(const x of ca){if(x===common)break;pts.push(...UP[x])}
 const down=[];for(const x of cb){if(x===common)break;down.unshift(...UP[x].slice().reverse())}
 return[...pts,...down,[b[0],b[2]]]}

  const env=(g,a,v,dc)=>{g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+dc)};
  if(b%4===0){const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.13);env(g,.003,.9,.3);o.connect(g);g.connect(AU.f);o.start(t);o.stop(t+.4)}

   const o=c.createOscillator(),g2=c.createGain();o.type="sawtooth";o.frequency.value=440*Math.pow(2,(ch[0]-12-69)/12);env(g2,.005,.13,.16);o.connect(g2);g2.connect(AU.f);o.start(t);o.stop(t+.25)}

  AU.next+=st;AU.step++}}

 else{o.agit=clamp(o.agit+6,0,100);o.aggro=true;fLog(`${o.name} se dégage.`);PL.sta-=8}}

 const P=PLAYER.p.pos;let any=false;
 for(const o of FIGHT.foes){if(o.st!=="active")continue;const d=Math.hypot(o.npc.pos[0]-P[0],o.npc.pos[2]-P[2]);if(d>4)continue;

 let mx=0,mz=0;const f=fwd(),r=[-f[1],f[0]];if(KEYS.KeyW||KEYS.ArrowUp){mx+=f[0];mz+=f[1]}if(KEYS.KeyS||KEYS.ArrowDown){mx-=f[0];mz-=f[1]}if(KEYS.KeyA||KEYS.ArrowLeft){mx-=r[0];mz-=r[1]}if(KEYS.KeyD||KEYS.ArrowRight){mx+=r[0];mz+=r[1]}

function fEscort(){const P=PLAYER.p.pos;let o=null,bd=1.8;for(const f of FIGHT.foes){if(f.st!=="controlled"&&f.st!=="calm")continue;const d=Math.hypot(f.npc.pos[0]-P[0],f.npc.pos[2]-P[2]);if(d<bd){bd=d;o=f}}

function stepFight(dt){
 const F=FIGHT;F.t+=dt;F.vcd=Math.max(0,F.vcd-dt);PL.cd=Math.max(0,PL.cd-dt);PL.hurtT=Math.max(0,PL.hurtT-dt);

 if(blocking)pose(p,{armL:-2.7,armR:-2.5,lean:.1},.06);

 for(const o of F.foes){

  const dx=P[0]-n.pos[0],dz=P[2]-n.pos[2],d=Math.hypot(dx,dz);
  if(o.st==="grabbed"){o.t+=dt;const f=fwd();n.pos[0]=P[0]+f[0]*.62;n.pos[2]=P[2]+f[1]*.62;n.yaw=PLAYER.camYaw;PL.sta-=14*dt;pose(n,{armL:.5,armR:.5,lean:.35},.06);pose(p,{armL:-1.1,armR:-1.3,lean:.3},.06);
   if(PL.sta<=0){o.st="active";o.stag=0;o.agit=clamp(o.agit+8,0,100);PL.cd=.8;fLog(`Épuisé, tu lâches ${o.name}.`);continue}
   if(o.t>2.3){o.st="controlled";o.ctrlT=0;n.anim="sit";n.pose=null;o.agit=clamp(o.agit-35,0,100);fLog(`${o.name} est maîtrisé, au sol, à genoux. (E : le raccompagner)`)}continue}
  if(o.st==="controlled"){o.ctrlT+=dt;pose(n,{armL:.6,armR:.6,lean:.6},.06);
   if(o.ctrlT>18&&o.warned===0){o.warned=1;fLog(`${o.name} : « J'arrive plus à respirer… »`)}
   if(o.ctrlT>30&&o.warned===1){o.warned=2;F.stats.longPin++;fLog(`${o.name} ne répond plus très bien…`)}continue}
  if(o.st==="calm"){pose(n,{armL:-2.8,armR:-2.8},.06);o.ctrlT+=dt;continue}
  if(o.st!=="active")continue;
  // désescalade naturelle
  o.agit=clamp(o.agit-(o.weapon?.3:1.1)*dt-(o.sta<30?2*dt:0),0,100);
  if(o.agit<22){o.st="calm";o.ctrlT=0;n.ring=null;n.anim="idle";fLog(`${o.name} lève les mains : « C'est bon, c'est bon ! »`);continue}
  if(o.stag>0){n.anim="fight";continue}
  // cible : toi, ou l'autre bagarreur si tu es loin
  let tx=P[0],tz=P[2],td=d,vsFoe=false;
  const atk=F.foes.filter(x=>x!==o&&x.st==="active"&&x.aggro&&x.t>0).length;
  if(o.other&&o.other!==o&&o.other.st==="active"&&(!o.aggro||d>3.5)){const q=o.other.npc.pos;tx=q[0];tz=q[2];td=Math.hypot(q[0]-n.pos[0],q[2]-n.pos[2]);vsFoe=true}
  if(!vsFoe&&!o.aggro){if(d<1.3||chance(.004))o.aggro=true;else{n.anim="fight";n.yaw=turn(n.yaw,Math.atan2(dx,dz),dt*4);continue}}
  const ty=Math.atan2(tx-n.pos[0],tz-n.pos[2]);n.yaw=turn(n.yaw,ty,dt*8);
  if(o.t>0){o.t-=dt;n.ring=[.9*(.6+.4*Math.sin(TT*30)),.05,.05];pose(n,{armR:.9,armL:-1.4,lean:-.25},.06);
   if(o.t<=0){n.ring=null;pose(n,{armR:-1.6,lean:.35},.25);o.cd=R(1.3,2.6)/o.aggr;
    if(vsFoe){if(td<1.6){o.other.hp-=6;pose(o.other.npc,{lean:-.4},.3)}continue}
    o.lastAtk=TT;

     else{let dmg=o.weapon?26*(CAR&&CAR.equip.gilet?.4:1)*(CAR&&CAR.equip.gants?.85:1):R(6,10);if(blocking&&!o.weapon){dmg*=.18;F.stats.blocked++;PL.sta-=10}else if(blocking){dmg*=.6}
      PL.hp-=dmg;F.stats.taken+=dmg;SHAKE=blocking?.08:.22;PL.hurtT=.3;flash(o.weapon?"rgba(255,0,0,.45)":"rgba(255,40,40,.25)");
      fLog(o.weapon?`${o.name} te touche avec la lame !`:blocking?`Tu bloques le coup de ${o.name}.`:`${o.name} te frappe !`)}}}
   continue}

function careerSetup(){
 if(!CAR)return;const N=NIGHTS3[CAR.night%5];const se=CAR.season-1;G.N=N;G.alea=CAR.alea||ALEAS3[0];G.cap=Math.round(VEN3.cap*N.cap/110/5)*5;
 G.pendQ=[];(G.alea.inc||[]).forEach(x=>{if(INC[x])G.pendQ.push(x)});
 G.calls=shuffle(N.ger.slice()).slice(0,1+(se>0||CAR.night%5>=3?1:0));G.callT=[70,170];
 if(CAR.gone){const a=G.colleagues.find(x=>x.name===CAR.gone);if(a){if(CAR.extraF||a.sex==="H"){a.name="Extra";a.band=hex("#999999")}else{rmPerson(a);G.colleagues.splice(G.colleagues.indexOf(a),1)}}}
 if(CAR.drunkAg){const a=G.colleagues.find(x=>x.name===CAR.drunkAg);if(a){a.sway=.4;a.drunk=true}}
 if(CAR.sam){const s=mkPerson({agent:true,sex:"H",pos:[2.4,0,.4],skin:SKINS[1],hair:HAIRS[4],hs:"short",height:1.76,band:"#e4ff4d",noBeard:true});s.name="Sam";s.yaw=Math.PI;s.home=agentHomes()[4];s.col="#e4ff4d";s.rookie=true;G.colleagues.push(s)}
 if(CAR.morale<40)G.colleagues.forEach(a=>a.slow=true);
}
function careerEnd(note){
 if(!CAR)return"";const n=CAR.night;CAR.night++;
 if(CAR.night%5===0)CAR.season++;
 const xp=Math.max(0,note*10+G.goods.length*4-G.faults.length*3);const r0=rank3(CAR.xp);CAR.xp+=xp;const r1=rank3(CAR.xp);
 CAR.sat=clamp(CAR.sat+(note-11)*1.6+(G.rep-60)*.08,0,100);
 CAR.funds+=Math.round(60+note*6);CAR.morale=clamp(CAR.morale+(G.faults.length<=2?3:-3),0,100);
 const hl=headline3();CAR.papers.push({n:n+1,...hl});
 trophy("first");if(!G.faults.length)trophy("perfect");if(note>=18)trophy("twenty");
 const mq=G.served&&G.minorsQ>0&&!G.minorIn;if(mq)trophy("physio");
 if(G.faults.some(f=>/testing|Discrimination|discrimin/i.test(f.t+f.law)))CAR.discri=true;
 if(CAR.night%5===0){if(CAR.sat>=20)trophy("season");if(!CAR.discri)trophy("clean");CAR.discri=false}
 CAR.hist.push({n:n+1,note});CAR.alea=null;CAR.tev=undefined;CAR.tevRes=null;CAR.gone=null;CAR.drunkAg=null;CAR.extraF=false;
 const fired=CAR.sat<15;if(fired){CAR.sat=50;if(CAR.night%5!==0){CAR.night=Math.ceil(CAR.night/5)*5;CAR.season=CAR.night/5+1}}
 const nt=(G.newTroph||[]);carSave();
 return`<div class="res" style="border-color:#ffc04d">🎖️ +${xp} XP${r1>r0?` — <b>Promotion : ${RANKS3[r1][1]} !</b>`:""} · Gérant ${Math.round(CAR.sat)}/100 · Fonds ${CAR.funds} €</div>
 <div class="res ${hl.bad?"b":""}" style="font-family:Georgia,serif"><div class="sub">📰 La Gazette du lendemain</div><b style="font-size:17px">${esc(hl.t)}</b><br><i>${esc(hl.sub)}</i></div>
 ${nt.map(t=>`<div class="res" style="border-color:#ff3d9a">🏆 Trophée débloqué : ${t.i} <b>${t.n}</b> — ${t.d}</div>`).join("")}
 ${fired?`<div class="res b"><b>Le gérant met fin à ta mission.</b> Satisfaction trop basse : tu es remplacé. Ta progression (grade, trophées) est conservée.</div>`:""}`;
}
function headline3(){
 const F=G.faults.map(f=>f.t+" "+f.law).join(" ");
 const H=[[/inconscient|SAMU appelé/,"Un client hospitalisé après une intervention musclée "+auVen()+"","Une enquête est ouverte sur les méthodes de la sécurité."],
  [/sans être attaqué|déjà maîtrisée/,"Vidéo choc : un agent de sécurité "+duVen()+" frappe un client","Les images tournent sur les réseaux sociaux."],
  [/RIXE|rixe/i,"Nuit de violence "+auVen()+" : une rixe fait plusieurs blessés","Le préfet pourrait ordonner une fermeture administrative."],
  [/couteau|arme/i,"Un client blessé au couteau "+auVen()+"","La question des contrôles à l'entrée est posée."],
  [/testing|Discrimination/,"Discrimination à l'entrée "+duVen()+" : une association porte plainte","Les images du refus circulent sur les réseaux."],
  [/Jauge/,VEN3.name+" : bondé au-delà de sa capacité","Un client : « On ne pouvait plus bouger. »"],
  [/Mineur|mineur/,"Des mineurs servis en alcool "+auVen()+" ?","Les parents d'une adolescente s'indignent."],
  [/feu|incendie/i,"Début d'incendie "+auVen()+", évacuation","Les pompiers sont intervenus dans la nuit."]];
 for(const[re,t,sub]of H)if(re.test(F))return{t,sub,bad:true};
 if(G.faults.length>=5)return{t:"Soirée agitée "+auVen()+"",sub:"Plusieurs incidents signalés par des riverains.",bad:true};
 if(G.goods.length>=8&&G.faults.length<=1)return{t:""+VEN3.name+", l'adresse où l'on fait la fête en sécurité",sub:"Clients et riverains saluent le travail de l'équipe de sécurité.",bad:false};
 return{t:"Une nuit ordinaire "+auVen()+"",sub:"Rien à signaler dans la presse locale.",bad:false}}

function auVen(){const n=VEN3.name;return n.startsWith("Le ")?"au "+n.slice(3):n.startsWith("L'")?"à l'"+n.slice(2):"à "+n}
function duVen(){const n=VEN3.name;return n.startsWith("Le ")?"du "+n.slice(3):n.startsWith("L'")?"de l'"+n.slice(2):"de "+n}
function venueList(cur,onpick,xp){return Object.entries(VENUES3).map(([k,v])=>{const lock=xp!=null&&xp<v.unlock;return`<div class="res ${k===cur?"":"n"}" style="font-size:13px;${lock?"opacity:.5":""}"><b>${v.name}</b> — ${v.type} · jauge ${v.cap} · ${v.agents.length+1} agents<br><span class="sub">${v.sub}</span>${k===cur?`<div class="sub" style="color:#3ee08f">✔ Ton établissement</div>`:lock?`<div class="sub">🔒 Débloqué à ${v.unlock} XP</div>`:`<button class="btn cy" onclick="${onpick}('${k}')">Choisir</button>`}</div>`}).join("")}
function setVenue(k){CAR.venue=k;CAR.tev=undefined;CAR.tevRes=null;carSave();vestiaire()}
buildWorld();
requestAnimationFrame(frame);
menu();
</script></body></html>
